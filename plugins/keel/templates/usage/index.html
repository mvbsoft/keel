<title>keel usage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: an instrument console. One header strip (name, tabs, period), then readouts (tiles),
   then charts and ledgers on a 12-column grid that folds to one column on a phone. */
:root {
  --bg: #F3F5F3; --surface: #FFFFFF; --sunken: #E9EDEA; --ink: #16201C; --muted: #56635E; --faint: #87928D;
  --line: #D8DEDA; --line-strong: #B5BFBA;
  --accent: #1B6B58; --accent-ink: #FFFFFF; --accent-soft: #DCEEE7;
  --warn: #8F5400; --warn-soft: #FAEBD3; --bad: #A93535; --bad-soft: #F7E1DF; --good: #1D7542; --good-soft: #DDF0E3;
  --violet: #5646B0; --violet-soft: #E8E4F8; --focus: #2F6FB3;
  --m-opus: #6556C9; --m-opus-2: #9A8FE0; --m-sonnet: #13846A; --m-sonnet-2: #58BB9F; --m-haiku: #C2552C; --m-haiku-2: #E4916C;
  --c1: #2F6FB3; --c2: #C2477A; --c3: #B87D0E; --c4: #2B9584; --c5: #77706A; --c6: #8A7BD3; --c7: #D16E55; --c8: #4C8A37;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1412; --surface: #161E1B; --sunken: #1C2622; --ink: #E2EAE6; --muted: #9DAAA4; --faint: #6E7B75;
    --line: #27312D; --line-strong: #3A4641;
    --accent: #5CC4A5; --accent-ink: #0E1412; --accent-soft: #183A31;
    --warn: #E9B266; --warn-soft: #3A2C14; --bad: #F08A80; --bad-soft: #3D1F1C; --good: #6FD39A; --good-soft: #173726;
    --violet: #B4A8F5; --violet-soft: #2A2545; --focus: #7FB2EE;
    --m-opus: #9D92F0; --m-opus-2: #6D61C4; --m-sonnet: #4FC9A6; --m-sonnet-2: #2C8C72; --m-haiku: #F0956C; --m-haiku-2: #B9603F;
    --c1: #6FA8E8; --c2: #E97FAA; --c3: #E5B44C; --c4: #5CC7B4; --c5: #ABA39C; --c6: #B1A6F2; --c7: #F09A82; --c8: #8FC97A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1412; --surface: #161E1B; --sunken: #1C2622; --ink: #E2EAE6; --muted: #9DAAA4; --faint: #6E7B75;
  --line: #27312D; --line-strong: #3A4641;
  --accent: #5CC4A5; --accent-ink: #0E1412; --accent-soft: #183A31;
  --warn: #E9B266; --warn-soft: #3A2C14; --bad: #F08A80; --bad-soft: #3D1F1C; --good: #6FD39A; --good-soft: #173726;
  --violet: #B4A8F5; --violet-soft: #2A2545; --focus: #7FB2EE;
  --m-opus: #9D92F0; --m-opus-2: #6D61C4; --m-sonnet: #4FC9A6; --m-sonnet-2: #2C8C72; --m-haiku: #F0956C; --m-haiku-2: #B9603F;
  --c1: #6FA8E8; --c2: #E97FAA; --c3: #E5B44C; --c4: #5CC7B4; --c5: #ABA39C; --c6: #B1A6F2; --c7: #F09A82; --c8: #8FC97A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; padding: 0 16px 48px; }
.wrap { max-width: 1240px; margin: 0 auto; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
h2 { font-size: 18px; font-weight: 600; margin: 0; text-wrap: balance; }
h3 { font-size: 13px; font-weight: 600; margin: 0 0 10px; letter-spacing: .02em; color: var(--muted); text-transform: uppercase; }
.num, td, .tile .v { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.small { font-size: 12px; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding-block: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.brand { font-family: var(--font-num); font-weight: 500; font-size: 15px; letter-spacing: -.01em; display: flex; align-items: baseline; gap: 6px; }
.brand b { color: var(--accent); font-weight: 500; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
.tabs a { text-decoration: none; color: var(--muted); padding: 6px 11px; border-radius: 6px; font-weight: 500; }
.tabs a:hover { color: var(--ink); background: var(--sunken); }
.tabs a[aria-current="page"] { color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.range { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.range[hidden] { display: none !important; }
select, input[type="date"], input[type="search"], button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 6px; padding: 5px 8px; min-height: 32px; max-width: 100%; }
button { cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.link { border: 0; background: none; color: var(--accent); padding: 0; min-height: 0; text-align: left; text-decoration: underline; text-underline-offset: 2px; }
.banner { margin-top: 12px; padding: 8px 12px; border-radius: var(--r); background: var(--warn-soft); color: var(--warn); font-size: 13px; }

/* sections */
main { padding-block: 18px; display: grid; gap: 22px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
.span-12 { grid-column: span 12; } .span-8 { grid-column: span 8; } .span-6 { grid-column: span 6; } .span-4 { grid-column: span 4; }
@media (max-width: 900px) { .span-8, .span-6, .span-4 { grid-column: span 12; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tiles.sm { grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 11px 13px; min-width: 0; display: grid; gap: 2px; align-content: start; }
.tile .l { font-size: 12px; color: var(--muted); }
.tile .v { font-family: var(--font-num); font-size: 22px; font-weight: 500; letter-spacing: -.02em; overflow-wrap: anywhere; }
.tiles.sm .tile .v { font-size: 18px; }
.tile .s { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.tile.hl { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.chart { position: relative; height: 240px; }
.chart.tall { height: 280px; }
details.fallback { margin-top: 8px; font-size: 12px; }
details.fallback summary { cursor: pointer; color: var(--muted); }
.empty { padding: 26px 18px; text-align: center; color: var(--muted); border: 1px dashed var(--line-strong); border-radius: var(--r); background: var(--surface); }
.empty h2 { color: var(--ink); margin-bottom: 8px; }
.empty p { max-width: 62ch; margin: 6px auto; }

/* bar lists (ledgers) */
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: minmax(0, 9em) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; }
.bar .k { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .k.sub { padding-left: 12px; color: var(--muted); }
.bar .track { height: 10px; background: var(--sunken); border-radius: 3px; overflow: hidden; }
.bar .fill { height: 100%; border-radius: 3px; background: var(--accent); }
.bar .n { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.bar .n span { color: var(--muted); margin-left: 6px; display: inline-block; min-width: 3.4em; }

/* chips and pills */
.chip { display: inline-block; font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 999px; white-space: nowrap; background: var(--sunken); color: var(--muted); vertical-align: 1px; }
.chip.subscription { background: var(--good-soft); color: var(--good); }
.chip.api { background: var(--warn-soft); color: var(--warn); }
.chip.credit { background: var(--violet-soft); color: var(--violet); }
.chip.level { background: var(--accent-soft); color: var(--accent); }
.chip.kept { background: var(--good-soft); color: var(--good); }
.chip.dropped { background: var(--bad-soft); color: var(--bad); }
.chip.pending { background: var(--warn-soft); color: var(--warn); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }

/* filters */
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 8px; }
.filters.wide { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.f { display: grid; gap: 3px; font-size: 12px; color: var(--muted); min-width: 0; }
.f select, .f input { width: 100%; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
.toolbar .f { flex: 1 1 140px; }
.toolbar .f.grow { flex: 3 1 220px; }
.drill { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 7px 10px; border-radius: var(--r); background: var(--accent-soft); color: var(--ink); font-size: 13px; }

/* tables */
.tw { overflow-x: auto; min-width: 0; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { font-weight: 500; font-size: 12px; color: var(--muted); text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; vertical-align: bottom; }
.tbl td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.tbl .L { text-align: left; }
.tbl td.wrap { white-space: normal; min-width: 12em; max-width: 30em; }
.tbl td.ell { max-width: 22em; overflow: hidden; text-overflow: ellipsis; }
.tbl tr.total td { font-weight: 600; border-top: 1px solid var(--line-strong); }
.tbl tr.grp td { background: var(--sunken); font-weight: 600; }
.tbl tbody tr.click { cursor: pointer; }
.tbl tbody tr.click:hover td { background: var(--sunken); }
.tbl th button.sort { border: 0; background: none; color: inherit; padding: 0; min-height: 0; font: inherit; cursor: pointer; }
.tbl th[aria-sort="ascending"] button::after { content: " \2191"; }
.tbl th[aria-sort="descending"] button::after { content: " \2193"; }
.tbl .mini { height: 8px; background: var(--c1); border-radius: 2px; min-width: 2px; }
@media (max-width: 640px) {
  .tbl thead { display: none; }
  .tbl, .tbl tbody, .tbl tr, .tbl td { display: block; width: 100%; }
  .tbl tr { border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px; margin-bottom: 8px; background: var(--surface); }
  .tbl tr.grp { background: var(--sunken); }
  .tbl td { display: flex; justify-content: space-between; gap: 14px; padding: 3px 0; border: 0; text-align: right; white-space: normal; min-width: 0; max-width: none; }
  .tbl td::before { content: attr(data-label); color: var(--muted); text-align: left; flex: 0 0 auto; }
  .tbl td.lead { font-weight: 600; font-size: 14px; justify-content: flex-start; text-align: left; }
  .tbl td.lead::before, .tbl td.nolabel::before { display: none; }
  .tbl td:empty { display: none; }
  .tbl tr.total td { border-top: 0; }
  .bar { grid-template-columns: minmax(0, 7em) minmax(0, 1fr) auto; }
}

/* session page */
.sp-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.sp-head h2 { font-size: 17px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 500; }
.lanes { display: grid; gap: 5px; }
.lane { display: grid; grid-template-columns: minmax(0, 10em) minmax(0, 1fr); gap: 10px; align-items: center; font-size: 12px; }
.lane .k { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lane .track { position: relative; height: 14px; background: var(--sunken); border-radius: 3px; }
.lane .seg { position: absolute; top: 0; height: 100%; border-radius: 3px; min-width: 3px; }
.lane .seg.resumed { background-image: repeating-linear-gradient(135deg, transparent 0 4px, rgba(127,127,127,.35) 4px 6px); }
.axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.loading { padding: 40px 0; color: var(--muted); text-align: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand" id="brand">keel <b>usage</b></div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <div class="range" id="range"></div>
  </header>
  <div id="banner"></div>
  <main id="view" aria-live="polite"><div class="loading">…</div></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" integrity="sha512-CQBWl4fJHWbryGE+Pc7UAxWMUMNMWzWxF4SQo9CgkJIN1kx6djDQZjh3Y8SZ1d+6I+1zze6Z7kHXO7q3UyZAWw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="pivot.js"></script>
<script src="i18n.js"></script>
<script src="i18n.uk.js"></script>
<script>
(function () {
  'use strict';
  const P = window.KeelPivot;
  const I = window.KeelI18n;
  const $ = (id) => document.getElementById(id);
  const VIEW = $('view');


  let lang = /^uk/i.test(navigator.language || '') ? 'uk' : 'en';
  const t = (key, vars) => I.t(lang, key, vars);

  // ---- formatting ----------------------------------------------------------------------------------
  const loc = () => (lang === 'uk' ? 'uk-UA' : 'en-GB');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fin = (x) => typeof x === 'number' && Number.isFinite(x);
  function nf(x, d) { return new Intl.NumberFormat(loc(), { minimumFractionDigits: d, maximumFractionDigits: d }).format(x); }
  function fUsd(x) { if (!fin(x)) return '—'; return '$' + nf(x, Math.abs(x) >= 1000 ? 0 : 2); }
  function fPct(x, d) { return fin(x) ? nf(x, d == null ? 1 : d) + ' %' : '—'; }
  function fTok(x) {
    x = Number(x) || 0;
    if (x >= 1e9) return nf(x / 1e9, 2) + 'B';
    if (x >= 1e6) return nf(x / 1e6, x >= 1e7 ? 1 : 2) + 'M';
    if (x >= 1e3) return nf(x / 1e3, 0) + 'k';
    return nf(x, 0);
  }
  function fDur(min) {
    min = Math.round(Number(min) || 0);
    const h = Math.floor(min / 60); const m = min % 60;
    return h ? `${h} ${t('common.hours_short')} ${m} ${t('common.minutes_short')}` : `${m} ${t('common.minutes_short')}`;
  }
  const fHrs = (min) => nf((Number(min) || 0) / 60, 1) + ' ' + t('common.hours_short');
  const fInt = (x) => nf(Number(x) || 0, 0);
  function toMs(v) {
    if (v == null || v === '') return NaN;
    if (typeof v === 'number') return v < 1e12 ? v * 1000 : v;
    const n = Date.parse(v); return Number.isFinite(n) ? n : NaN;
  }
  function fDay(dateStr) { // 'YYYY-MM-DD' (UTC date) -> 'dd.mm'
    const p = String(dateStr || '').split('-').map(Number);
    if (p.length < 3 || p.some((x) => !Number.isFinite(x))) return String(dateStr || '—');
    return new Intl.DateTimeFormat(loc(), { day: '2-digit', month: '2-digit', timeZone: 'UTC' }).format(new Date(Date.UTC(p[0], p[1] - 1, p[2])));
  }
  function fDT(v) { const m = toMs(v); return Number.isFinite(m) ? new Intl.DateTimeFormat(loc(), { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }).format(new Date(m)) : '—'; }
  function fHM(v) { const m = toMs(v); return Number.isFinite(m) ? new Intl.DateTimeFormat(loc(), { hour: '2-digit', minute: '2-digit' }).format(new Date(m)) : '—'; }
  function fDate(v) { const m = toMs(v); return Number.isFinite(m) ? new Intl.DateTimeFormat(loc(), { day: '2-digit', month: '2-digit', year: 'numeric' }).format(new Date(m)) : '—'; }
  const unitOf = (id) => (P.measures.find((m) => m.id === id) || { unit: 'count' }).unit;
  function fMeasure(v, id) {
    const u = unitOf(id);
    if (u === 'usd') return fUsd(v);
    if (u === 'tokens') return fTok(v);
    if (u === 'min') return fHrs(v);
    return fInt(v);
  }
  const chartVal = (v, id) => (unitOf(id) === 'min' ? v / 60 : v);
  const walletName = (w) => t('wallet.' + (['subscription', 'api', 'credit'].includes(w) ? w : 'unknown'));
  const walletChip = (w) => `<span class="chip ${esc(w)}">${esc(walletName(w))}</span>`;
  const cap = (s) => (s ? String(s).charAt(0).toUpperCase() + String(s).slice(1) : '');
  function dimLabel(dim, key) {
    if (key == null || key === 'unknown' || key === '') return t('common.unknown');
    switch (dim) {
      case 'day': return fDay(key);
      case 'week': return String(key).replace(/^\d{4}-/, '');
      case 'hour': return key + ':00';
      case 'participant': return key === 'main' ? t('participant.main') : key;
      case 'wallet': return walletName(key);
      default: return String(key);
    }
  }
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const addDays = (ds, n) => { const p = ds.split('-').map(Number); const d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)); return d.toISOString().slice(0, 10); };

  // ---- colors (from tokens) ------------------------------------------------------------------------
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const PAL = ['--c1', '--c2', '--c3', '--c4', '--c5', '--c6', '--c7', '--c8'];
  const order = {}; // dim -> sorted keys (stable colors across charts)
  function colorFor(dim, key) {
    if (dim === 'model') {
      const base = /opus/.test(key) ? 'opus' : /sonnet/.test(key) ? 'sonnet' : /haiku/.test(key) ? 'haiku' : null;
      if (base) {
        const same = (order.model || []).filter((k) => k.includes(base));
        const i = Math.max(0, same.indexOf(key));
        if (i === 0) return css('--m-' + base);
        if (i === 1) return css('--m-' + base + '-2');
      }
    }
    const list = order[dim] || [];
    let i = list.indexOf(key);
    if (i < 0) i = Math.abs([...String(key)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) | 0, 7));
    return css(PAL[i % PAL.length]);
  }

  // ---- state ---------------------------------------------------------------------------------------
  const store = {
    get(k) { try { const v = sessionStorage.getItem('keel-usage.' + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
    set(k, v) { try { sessionStorage.setItem('keel-usage.' + k, JSON.stringify(v)); } catch (e) { /* storage blocked */ } },
  };
  const S = {
    mode: 'loading', demo: false, error: null, db: null, downloads: null,
    range: store.get('range') || { preset: '30', from: addDays(today(), -29), to: today() },
    docs: [], machines: [], calibs: [], calib: null,
    flat: { sessions: [], rows: [], hours: [], snapshots: [] }, rows: [], sessions: [],
    an: Object.assign({ pc: '', user: '', project: '', wallet: '', participant: '', model: '', by: 'day', split: 'model', measure: 'usd', touched: false }, store.get('an') || {}),
    ss: Object.assign({ search: '', pc: '', project: '', wallet: '', group: 'none', sort: 'date', dir: 'desc', drill: null }, store.get('ss') || {}),
    lastTab: null,
  };
  if (S.range.preset !== 'custom') { const n = Number(S.range.preset) || 30; S.range.from = addDays(today(), -(n - 1)); S.range.to = today(); }
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // ---- data loading --------------------------------------------------------------------------------
  async function retry(fn) {
    try { return await fn(); } catch (e) {
      if (e && e.code === 'unavailable') { await sleep(400 + Math.random() * 600); return fn(); }
      throw e;
    }
  }
  async function queryDays(db, from, to) {
    const out = new Map();
    let cursor = from;
    for (let guard = 0; guard < 40; guard++) {
      const snap = await retry(() => db.collection('days').where('date', '>=', cursor).where('date', '<=', to).orderBy('date').limit(1000).get());
      let added = 0; let last = cursor;
      for (const d of snap.docs) {
        const body = d.data();
        if (!body) continue;
        if (!out.has(d.id)) { out.set(d.id, body); added++; }
        if (body.date > last) last = body.date;

  // ---- Analysis ------------------------------------------------------------------------------------

  const keyOf = (r, by) => P.group([r], by)[0].key;

      .map(([k, v, l]) => tile(t(l || k), v)).join('');
    const partKeys = split ? (() => { const sums = {}; for (const g of groups) for (const [k, v] of Object.entries(g.parts)) sums[k] = (sums[k] || 0) + v[ms]; return Object.keys(sums).sort((x, y) => sums[y] - sums[x]); })() : [];
    const head = `<tr><th class="L" scope="col">${esc(t('dim.' + by))}</th>${TABLE_MEASURES.map((m) => `<th scope="col">${esc(t('measure_short.' + m))}</th>`).join('')}<th scope="col">${esc(t('common.share'))}</th></tr>`;
    const cell = (m, v) => `<td data-label="${esc(t('measure_short.' + m))}"${m === ms ? ' style="font-weight:600"' : ''}>${esc(fMeasure(v, m))}</td>`;

    const html = `<section class="panel" style="display:grid;gap:10px">${filtersHtml}</section>

      <section class="tw"><table class="tbl"><thead>${head}</thead><tbody>${body}${totalRow}</tbody></table></section>

      const g = groups[i]; if (!g) return;
      const keys = [...new Set(fr.filter((r) => keyOf(r, by) === g.key).map((r) => r.session))];

          type: 'bar',
          data: { labels: groups.map((g) => dimLabel(by, g.key)), datasets: ds },
          options: {
            onClick: (e, els) => { if (els && els.length) drill(els[0].index); },
            onHover: (e, els) => { e.native && (e.native.target.style.cursor = els.length ? 'pointer' : 'default'); },
            plugins: { legend: { display: !!split, position: 'bottom' }, tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${fmtAxis(c.raw)}` } } },
            scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, ticks: { callback: fmtAxis } } },

  }

  // ---- Sessions ------------------------------------------------------------------------------------
  const SCOLS = ['date', 'pc', 'project', 'task', 'models', 'usd', 'week_pct', 'level'];
  function sessionsData() {
    const ss = S.ss; const one = (v) => (v ? [v] : []);
    let list = S.sessions;
    if (ss.drill && ss.drill.keys) { const k = new Set(ss.drill.keys); list = S.flat.sessions.filter((s) => k.has(s.key)); }
    const sortKey = ss.sort === 'week_pct' ? 'usd' : ss.sort;
    const res = P.sessionsTable(list, { sort: sortKey, dir: ss.dir, filters: { pc: one(ss.pc), project: one(ss.project), wallet: one(ss.wallet) }, search: ss.search, groupBy: ss.group });
    const rate = weeklyRate();
    const fill = (r) => { r.week_pct = r.wallet === 'subscription' && rate ? (r.usd / rate) : null; };
    res.rows.forEach(fill);
    if (ss.sort === 'week_pct') {
      const fix = (rows) => { const a = rows.filter((r) => r.week_pct != null); const b = rows.filter((r) => r.week_pct == null); rows.splice(0, rows.length, ...a, ...b); };
      fix(res.rows); if (res.groups) res.groups.forEach((g) => fix(g.rows));
    }
    return res;
  }
  function weekCell(r) {
    if (r.week_pct != null) return esc(fPct(r.week_pct, 2));

  }
  function sessionRowHtml(r) {

  function viewSessions() {

      isSub && fr5 ? tile(t('sp.tile_five_hour'), '≈' + fPct(sp.totals.usd / fr5, 1), esc(acc('five_hour'))) : '',
      tile(t('sp.tile_turns'), `${fInt(sp.totals.turns)} / ${fInt(sp.totals.requests)}`),
      tile(t('sp.tile_tokens'), fTok(sp.cache.tokens), esc(sp.cache.cache_share != null ? t('sp.tile_cache', { pct: nf(sp.cache.cache_share * 100, 0) }) : '')),
    ].join('');
    // participant labels: number repeated types
    const cnt = {}; const seen = {};
    sp.participants.forEach((p) => { cnt[p.label] = (cnt[p.label] || 0) + 1; });
    const labels = sp.participants.map((p) => { seen[p.label] = (seen[p.label] || 0) + 1; const base = p.kind === 'main' ? t('participant.main') : p.label; return cnt[p.label] > 1 && p.kind !== 'main' ? `${base} #${seen[p.label]}` : base; });
    const lanes = sp.lanes.map((ln, i) => `<div class="lane"><span class="k" title="${esc(labels[i])}">${esc(labels[i])}</span><span class="track"><span class="seg${ln.resumed ? ' resumed' : ''}" style="left:${ln.left_pct}%;width:${Math.max(0.8, ln.width_pct)}%;background-color:${colorFor('model', ln.model)}" title="${esc(`${labels[i]} · ${ln.model} · ${fHM(ln.start)}–${fHM(ln.end)}`)}"></span></span></div>`).join('');
    const ticks = Number.isFinite(startMs) && Number.isFinite(endMs) ? [0, 0.25, 0.5, 0.75, 1].map((f) => `<span>${esc(fHM(startMs + (endMs - startMs) * f))}</span>`).join('') : '';
    const models = uniq(sp.participants.map((p) => p.family));
    const legend = `<div class="legend">${models.map((m) => `<span><span class="dot" style="background:${colorFor('model', m)}"></span>${esc(m)}</span>`).join('')}</div>`;
    const PL = { participant: t('col.participant'), model: t('col.model'), time: t('measure_short.time_min'), active: t('col.active'), req: t('col.requests') };
    const pRows = sp.participants.map((p, i) => {
      const min = Number.isFinite(toMs(p.end)) && Number.isFinite(toMs(p.start)) ? (toMs(p.end) - toMs(p.start)) / 60000 : 0;
      return `<tr><td class="L lead"><span>${esc(labels[i])}${p.resumed ? ` <span class="chip pending">${esc(t('sp.resumed'))}</span>` : ''}${p.output_estimated ? ` <span class="chip">${esc(t('sp.estimated'))}</span>` : ''}</span></td>
        <td class="L" data-label="${esc(PL.model)}"><span><span class="dot" style="background:${colorFor('model', p.family)}" aria-hidden="true"></span>${esc(p.family)}</span></td>
        <td data-label="${esc(PL.time)}">${esc(fDur(min))}</td><td data-label="${esc(PL.active)}">${esc(fDur(p.active_min))}</td>
        <td data-label="${esc(PL.req)}">${esc(fInt(p.requests))}</td>
        ${['in', 'cw5', 'cw1h', 'cr', 'out'].map((k) => `<td data-label="${esc(t('tok.' + k))}">${esc(fTok(p.tok[k]))}</td>`).join('')}
        <td data-label="$">${esc(fUsd(p.usd))}</td><td data-label="${esc(t('col.share'))}">${esc(fPct(p.share * 100, 0))}</td></tr>`;
    }).join('');
    const pt = sp.participants.reduce((a, p) => { for (const k in p.tok) a[k] = (a[k] || 0) + p.tok[k]; return a; }, {});
    const pTotal = `<tr class="total"><td class="L lead">${esc(t('common.total'))}</td><td class="nolabel"></td><td class="nolabel"></td><td data-label="${esc(PL.active)}">${esc(fDur(s.active_min))}</td><td data-label="${esc(PL.req)}">${esc(fInt(sp.totals.requests))}</td>${['in', 'cw5', 'cw1h', 'cr', 'out'].map((k) => `<td data-label="${esc(t('tok.' + k))}">${esc(fTok(pt[k] || 0))}</td>`).join('')}<td data-label="$">${esc(fUsd(sp.totals.usd))}</td><td data-label="${esc(t('col.share'))}">100 %</td></tr>`;
    const pTable = `<div class="tw"><table class="tbl"><thead><tr><th class="L" scope="col">${esc(PL.participant)}</th><th class="L" scope="col">${esc(PL.model)}</th><th scope="col">${esc(PL.time)}</th><th scope="col">${esc(PL.active)}</th><th scope="col">${esc(PL.req)}</th>${['in', 'cw5', 'cw1h', 'cr', 'out'].map((k) => `<th scope="col">${esc(t('measure_short.tok_' + k))}</th>`).join('')}<th scope="col">$</th><th scope="col">${esc(t('col.share'))}</th></tr></thead><tbody>${pRows}${pTotal}</tbody></table></div>`;
    const maxTurn = Math.max(0, ...sp.turns.map((x) => x.usd));
    const turns = sp.turns.length ? `<div class="tw"><table class="tbl"><thead><tr><th class="L" scope="col">${esc(t('measure_short.time_min'))}</th><th class="L" scope="col">${esc(t('sp.prompt'))}</th><th class="L" scope="col" aria-label="$"></th><th scope="col">$</th><th scope="col">${esc(t('col.requests'))}</th><th scope="col">${esc(t('chart.agents'))}</th></tr></thead><tbody>`
      + sp.turns.map((x) => `<tr><td class="L lead">${esc(x.t ? fHM(x.t) : t('sp.lead_turn'))}</td><td class="L wrap" data-label="${esc(t('sp.prompt'))}">${x.text ? esc(x.text) : `<span class="faint">${esc(t('sp.no_preview'))}</span>`}</td>
        <td class="L nolabel" style="width:18%"><div class="mini" style="width:${maxTurn ? Math.max(2, x.usd / maxTurn * 100) : 0}%"></div></td><td data-label="$">${esc(fUsd(x.usd))}</td><td data-label="${esc(t('col.requests'))}">${esc(fInt(x.requests))}</td><td data-label="${esc(t('chart.agents'))}">${esc(fInt(x.agents))}</td></tr>`).join('')
      + '</tbody></table></div>' : `<p class="muted">—</p>`;
    const tools = sp.tools.length ? barList(sp.tools.slice(0, 12).map((x) => ({ label: x.name, value: x.n, color: css('--c5') })), fInt) : '<p class="muted">—</p>';
    let keelBlock = '';
    if (s.keel) {
      const k = s.keel; const f = k.findings || {};
      const gates = k.gates == null ? '—' : typeof k.gates === 'string' ? k.gates : Object.entries(k.gates).map(([a, b]) => `${a}: ${b}`).join(', ');
      const steps = Array.isArray(k.steps) && k.steps.length ? `${k.steps.length} (${k.steps.map((x) => x.model || '?').join(', ')})` : '—';
      keelBlock = `<div class="panel span-6"><h3>${esc(t('sp.keel'))}</h3><dl class="kv">
        <dt>${esc(t('keel.level'))}</dt><dd>${k.level ? `<span class="chip level">${esc(cap(k.level))}</span>` : '—'}</dd>
        <dt>${esc(t('keel.findings'))}</dt><dd>${esc(`${f.must || 0} ${t('keel.must')} · ${f.should || 0} ${t('keel.should')} · ${f.nice || 0} ${t('keel.nice')}`)}</dd>
        <dt>${esc(t('keel.gates'))}</dt><dd>${esc(gates)}</dd>
        <dt>${esc(t('keel.lines'))}</dt><dd>${esc(k.lines ? `+${k.lines.add || 0} / −${k.lines.del || 0}` : '—')}</dd>
        <dt>${esc(t('keel.files'))}</dt><dd>${esc(k.files != null ? k.files : '—')}</dd>
        <dt>${esc(t('keel.steps'))}</dt><dd>${esc(steps)}</dd></dl></div>`;
    }
    const c = sp.cache;
    const cacheBlock = `<div class="panel span-${s.keel ? 6 : 12}"><h3>${esc(t('sp.cache'))}</h3><dl class="kv">
      <dt>${esc(t('cache.share'))}</dt><dd>${esc(c.cache_share != null ? fPct(c.cache_share * 100, 0) : '—')}</dd>
      <dt>${esc(t('cache.read'))}</dt><dd>${esc(fTok(c.cr))}</dd>
      <dt>${esc(t('cache.write5'))}</dt><dd>${esc(fTok(c.cw5))}</dd>
      <dt>${esc(t('cache.write1h'))}</dt><dd>${esc(fTok(c.cw1h))}</dd>
      <dt>${esc(t('tok.in'))} / ${esc(t('tok.out'))}</dt><dd>${esc(fTok(c.in))} / ${esc(fTok(c.out))}</dd></dl></div>`;
    const meta = [[t('sp.date'), fDate(s.start || s.date)], [t('sp.started') + '–' + t('sp.ended').toLowerCase(), `${fHM(s.start)}–${fHM(s.end)}`], [t('sp.pc'), s.pc], [t('sp.user'), s.user || '—'], [t('sp.branch'), s.branch || '—'], [t('sp.entrypoint'), s.entrypoint || '—']]
      .map(([k, v]) => `<span>${esc(k)}: <b>${esc(v)}</b></span>`).join('');
    const html = `${back}
      <section style="display:grid;gap:8px"><div class="sp-head"><h2>${esc(title)}</h2>${s.keel && s.keel.level ? `<span class="chip level">${esc(cap(s.keel.level))}</span>` : ''}${walletChip(s.wallet)}</div><div class="meta">${meta}</div></section>
      <section class="tiles sm">${tiles}</section>
      <section class="panel"><h3>${esc(t('sp.timeline'))}</h3><div class="lanes">${lanes}<div class="lane"><span></span><div class="axis">${ticks}</div></div></div>${legend}</section>
      <section><h3>${esc(t('sp.participants'))}</h3>${pTable}</section>
      <section><h3>${esc(t('sp.turns'))}</h3>${turns}</section>
      <section class="grid"><div class="panel span-6"><h3>${esc(t('sp.tools'))}</h3>${tools}</div>${keelBlock}${cacheBlock}</section>`;
    return { html };
  }

  // ---- Calibration ---------------------------------------------------------------------------------
  function viewCalib() {
    const c = S.calib;
    const pts = c ? [].concat(((c.weekly && c.weekly.points) || []).map((p) => Object.assign({}, p, { kind: 'weekly' })), ((c.five_hour && c.five_hour.points) || []).map((p) => Object.assign({}, p, { kind: 'five_hour' }))) : [];
    const v = P.calibrationView(pts, S.machines.map((m) => ({ pc: m.name || m.pc, synced_until: m.synced_until, last_seen: m.last_seen })), Date.now());
    const waiting = new Set([].concat(v.waiting, (c && c.waiting) || []));
    const wRate = c && c.weekly && fin(c.weekly.rate) ? c.weekly.rate : v.medians.weekly;
    const fRate = c && c.five_hour && fin(c.five_hour.rate) ? c.five_hour.rate : v.medians.five_hour;
    const dropped = v.rows.filter((r) => r.status === 'dropped').length;
    const tiles = `<section class="tiles">
      ${tile(t('cal.median_weekly'), wRate ? t('tile.rate', { usd: fUsd(wRate) }) : '—', esc(wRate ? t('tile.rate_n', { n: (c && c.weekly && c.weekly.n) || 0 }) : t('cal.none')), true)}
      ${tile(t('cal.median_five_hour'), fRate ? t('tile.rate', { usd: fUsd(fRate) }) : '—', esc(fRate ? t('tile.rate_n', { n: (c && c.five_hour && c.five_hour.n) || 0 }) : t('cal.none')))}
      ${tile(t('cal.dropped_n'), fInt(dropped), esc(t('cal.dropped_of', { n: dropped, total: v.rows.length })))}
    </section>`;
    const L = { kind: t('cal.kind'), win: t('cal.col_window'), gain: t('cal.col_gain'), usd: t('cal.col_usd'), rate: t('cal.col_rate'), st: t('cal.col_status') };
    const win = (r) => { const a = toMs(r.from); const b = toMs(r.to); return new Date(a).toDateString() === new Date(b).toDateString() ? `${fDT(a)}–${fHM(b)}` : `${fDT(a)} – ${fDT(b)}`; };
    const points = v.empty
      ? `<div class="empty"><h2>${esc(cap(t('cal.none')))}</h2><p>${esc(t('cal.none_hint'))}</p></div>`
      : `<div class="tw"><table class="tbl"><thead><tr><th class="L" scope="col">${esc(L.kind)}</th><th class="L" scope="col">${esc(L.win)}</th><th scope="col">${esc(L.gain)}</th><th scope="col">${esc(L.usd)}</th><th scope="col">${esc(L.rate)}</th><th class="L" scope="col">${esc(L.st)}</th></tr></thead><tbody>`
        + v.rows.map((r) => `<tr><td class="L lead">${esc(t('cal.kind_' + r.kind))}</td><td class="L" data-label="${esc(L.win)}">${esc(win(r))}</td>
          <td data-label="${esc(L.gain)}">+${esc(nf(Number(r.gain) || 0, 1))}</td><td data-label="${esc(L.usd)}">${esc(fUsd(r.usd))}</td>
          <td data-label="${esc(L.rate)}">${esc(r.rate > 0 ? fUsd(r.rate) : '—')}</td>
          <td class="L wrap" data-label="${esc(L.st)}"><span><span class="chip ${r.status}">${esc(t('cal.' + r.status))}</span>${r.reason && r.status !== 'kept' ? ` <span class="muted">${esc(t('cal.reason.' + r.reason))}</span>` : ''}</span></td></tr>`).join('')
        + '</tbody></table></div>';
    const ML = { pc: t('col.pc'), sync: t('cal.last_sync'), seen: t('cal.last_seen'), st: t('cal.state') };
    const machines = v.machines.length ? `<div class="tw"><table class="tbl"><thead><tr><th class="L" scope="col">${esc(ML.pc)}</th><th scope="col">${esc(ML.sync)}</th><th scope="col">${esc(ML.seen)}</th><th class="L" scope="col">${esc(ML.st)}</th></tr></thead><tbody>`
      + v.machines.map((m) => `<tr><td class="L lead">${esc(m.pc)}</td><td data-label="${esc(ML.sync)}">${esc(fDT(m.synced_until))}</td><td data-label="${esc(ML.seen)}">${esc(fDT(m.last_seen))}</td>
        <td class="L" data-label="${esc(ML.st)}">${waiting.has(m.pc) ? `<span class="chip pending">${esc(t('cal.waiting_for', { pc: m.pc }))}</span>` : `<span class="chip kept">${esc(t('cal.synced'))}</span>`}</td></tr>`).join('')
      + '</tbody></table></div>' : '<p class="muted">—</p>';
    const head = `<div class="sec-head"><h2>${esc(t('cal.title'))}</h2>${c ? `<span class="small muted">${esc(t('cal.computed_by', { pc: c.pc, when: fDT(c.computed_at) }))}</span>` : ''}</div>`;
    return { html: `${head}${tiles}<section><h3>${esc(t('cal.points'))}</h3>${points}</section><section><h3>${esc(t('cal.machines'))}</h3>${machines}</section>` };
  }

  // ---- shell ---------------------------------------------------------------------------------------
  function renderHeader(r) {
    $('tabs').setAttribute('aria-label', t('app.title'));
    $('tabs').innerHTML = TABS.map(([id, k]) => `<a href="#${id}"${r.tab === id || (r.tab === 'session' && id === 'sessions') ? ' aria-current="page"' : ''}>${esc(t(k))}</a>`).join('');
    const rg = $('range');
    rg.hidden = !(S.mode === 'ready') || r.tab === 'analysis' || r.tab === 'session' || r.tab === 'calib';
    if (!rg.hidden) {
      rg.innerHTML = `<label class="sr" for="rgPreset">${esc(t('range.label'))}</label><select id="rgPreset" data-range="preset">${['7', '30', '90', 'custom'].map((p) => `<option value="${p}"${S.range.preset === p ? ' selected' : ''}>${esc(t('range.' + p))}</option>`).join('')}</select>
        <label class="sr" for="rgFrom">${esc(t('filter.from'))}</label><input type="date" id="rgFrom" data-range="from" value="${esc(S.range.from)}">
        <label class="sr" for="rgTo">${esc(t('filter.to'))}</label><input type="date" id="rgTo" data-range="to" value="${esc(S.range.to)}">`;
    }
    $('banner').innerHTML = S.demo ? `<div class="banner">${esc(t('demo.banner'))}</div>` : '';
  }
  let current = null;
  function render() {
    const r = route();
    document.documentElement.lang = lang;
    renderHeader(r);
    killCharts();
    chartDefaults();
    if (S.mode === 'loading') { VIEW.innerHTML = `<div class="loading">${esc(t('app.loading'))}</div>`; return; }
    if (S.mode === 'nodb') { VIEW.innerHTML = `<div class="empty"><h2>${esc(t('nodb.title'))}</h2><p>${esc(t('nodb.text'))}</p><p class="small">${esc(t('nodb.demo'))}</p></div>`; return; }
    if (S.mode === 'error') { VIEW.innerHTML = `<div class="empty"><h2>${esc(t('app.error', { message: S.error }))}</h2></div>`; return; }
    const v = r.tab === 'analysis' ? viewAnalysis() : r.tab === 'sessions' ? viewSessions() : r.tab === 'calib' ? viewCalib() : r.tab === 'session' ? viewSession(r.key) : viewDash();
    current = v;
    VIEW.innerHTML = v.html;
    if (v.after) v.after();
  }

  // ---- events --------------------------------------------------------------------------------------
  let rangeTimer = null;
  function setRange(field, value) {
    if (field === 'preset') {
      S.range.preset = value;
      if (value !== 'custom') { const n = Number(value); S.range.from = addDays(today(), -(n - 1)); S.range.to = today(); }
    } else if (/^\d{4}-\d{2}-\d{2}$/.test(value)) { S.range[field] = value; S.range.preset = 'custom'; } else return;
    if (S.range.from > S.range.to) { const x = S.range.from; S.range.from = S.range.to; S.range.to = x; }
    store.set('range', S.range);
    clearTimeout(rangeTimer);
    rangeTimer = setTimeout(reload, 300);
  }
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.dataset.range) { setRange(el.dataset.range, el.value); return; }
    if (el.dataset.an) { S.an[el.dataset.an] = el.value; S.an.touched = true; store.set('an', S.an); render(); restoreFocus(el.id); return; }
    if (el.dataset.ss && el.dataset.ss !== 'search') { S.ss[el.dataset.ss] = el.value; store.set('ss', S.ss); render(); restoreFocus(el.id); }
  });
  let searchTimer = null;
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.dataset.ss === 'search') {
      S.ss.search = el.value; store.set('ss', S.ss);
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { const pos = el.selectionStart; render(); const n = $('ss_search'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) { /* ignore */ } } }, 250);
    }
  });
  function restoreFocus(id) { const n = id && $(id); if (n) n.focus(); }
  VIEW.addEventListener('click', (e) => {
    const el = e.target.closest('button, a, tr');
    if (!el) return;
    if (el.id === 'spBack') { if (S.lastTab && history.length > 1) history.back(); else location.hash = '#sessions'; return; }
    if (el.id === 'ssExport') { const d = sessionsData(); exportCsv(d.rows); return; }
    if (el.id === 'ssDrillClear') { S.ss.drill = null; store.set('ss', S.ss); render(); return; }
    if (el.dataset.sort) {
      const c = el.dataset.sort;
      if (S.ss.sort === c) S.ss.dir = S.ss.dir === 'asc' ? 'desc' : 'asc'; else { S.ss.sort = c; S.ss.dir = ['usd', 'week_pct', 'date'].includes(c) ? 'desc' : 'asc'; }
      store.set('ss', S.ss); render(); restoreFocus(null);
      const b = VIEW.querySelector(`button[data-sort="${c}"]`); if (b) b.focus();
      return;
    }
    if (el.dataset.drill != null && current && current.drill) { current.drill(Number(el.dataset.drill)); return; }
    if (el.tagName === 'TR' && el.dataset.key && !e.target.closest('a')) { location.hash = '#s.' + el.dataset.key; }
  });
  window.addEventListener('hashchange', () => {
    const r = route();
    if (r.tab !== 'session') S.lastTab = r.tab;
    render();
    if (r.tab === 'session') window.scrollTo(0, 0);
  });
  // re-color charts when the theme changes
  const rerender = () => { if (S.mode === 'ready') render(); };
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', rerender); } catch (e) { /* old browsers */ }
  new MutationObserver(rerender).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  if (!P || !I) { VIEW.innerHTML = '<div class="empty"><h2>pivot.js / i18n.js did not load.</h2></div>'; return; }
  S.lastTab = route().tab === 'session' ? null : route().tab;
  render();
  boot();
})();
</script>
