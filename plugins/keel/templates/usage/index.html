<title>keel usage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">

<div class="wrap">
  <header class="top">
    <div class="brand" id="brand">keel <b>usage</b></div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <div class="range" id="range"></div>
  </header>
  <div id="banner"></div>
  <main id="view" aria-live="polite"><div class="loading">…</div></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" integrity="sha512-CQBWl4fJHWbryGE+Pc7UAxWMUMNMWzWxF4SQo9CgkJIN1kx6djDQZjh3Y8SZ1d+6I+1zze6Z7kHXO7q3UyZAWw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="pivot.js"></script>
<script src="i18n.js"></script>
<script src="i18n.uk.js"></script>
<script src="format.js"></script>
<script src="colors.js"></script>
<script src="load.js"></script>
<script src="demo.js"></script>
<script>
(function () {
  'use strict';
  const P = window.KeelPivot;
  const I = window.KeelI18n;
  const $ = (id) => document.getElementById(id);
  const VIEW = $('view');


  let lang = /^uk/i.test(navigator.language || '') ? 'uk' : 'en';
  const t = (key, vars) => I.t(lang, key, vars);
  if (!P || !I || !window.KeelFormat || !window.KeelColors || !window.KeelLoad) { VIEW.innerHTML = '<div class="empty"><h2>pivot.js / i18n.js / format.js / colors.js / load.js did not load.</h2></div>'; return; }
  const {
    esc, fin, nf, fUsd, fPct, fTok, fDur, fHrs, fInt, toMs, fDay, fDT, fHM, fDate, unitOf, fMeasure, chartVal,
    walletName, walletChip, cap, dimLabel, today, addDays,
  } = window.KeelFormat(P, t, () => lang);
  const { css, PAL, order, colorFor, chartDefaults } = window.KeelColors();
  const { loadFromDb, fetchJson } = window.KeelLoad();

  // ---- state ---------------------------------------------------------------------------------------
  const store = {
    get(k) { try { const v = sessionStorage.getItem('keel-usage.' + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
    set(k, v) { try { sessionStorage.setItem('keel-usage.' + k, JSON.stringify(v)); } catch (e) { /* storage blocked */ } },
  };
  const S = {
    mode: 'loading', demo: false, error: null, db: null, downloads: null, failedFiles: 0,
    range: store.get('range') || { preset: '30', from: addDays(today(), -29), to: today() },
    docs: [], machines: [], calibs: [], calib: null,
    flat: { sessions: [], rows: [], hours: [], snapshots: [] }, rows: [], sessions: [],
    an: Object.assign({ pc: '', user: '', project: '', wallet: '', participant: '', model: '', by: 'day', split: 'model', measure: 'usd', touched: false }, store.get('an') || {}),
    ss: Object.assign({ search: '', pc: '', project: '', wallet: '', group: 'none', sort: 'date', dir: 'desc', drill: null }, store.get('ss') || {}),
    lastTab: null,
  };
  if (S.range.preset !== 'custom') { const n = Number(S.range.preset) || 30; S.range.from = addDays(today(), -(n - 1)); S.range.to = today(); }
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // ---- data loading --------------------------------------------------------------------------------
  function derive() {
    S.flat = P.flatten(S.docs);
    S.rows = P.filter(S.flat.rows, { from: S.range.from, to: S.range.to });
    S.sessions = S.flat.sessions.filter((s) => s.date >= S.range.from && s.date <= S.range.to);
    S.calib = S.calibs.slice().sort((a, b) => (toMs(b.computed_at) || 0) - (toMs(a.computed_at) || 0))[0] || null;
    // stable color order per dimension: by total $ over everything loaded
    for (const dim of ['model', 'pc', 'project', 'participant', 'user']) order[dim] = P.group(S.flat.rows, dim).map((g) => g.key);
  }
  let loadSeq = 0;
  async function reload() {
    const seq = ++loadSeq;
    if (S.demo) { derive(); render(); return; }
    S.mode = 'loading'; render();
    try {
      const from = S.range.from < addDays(today(), -8) ? S.range.from : addDays(today(), -8); // tiles need the current week
      const to = S.range.to > today() ? S.range.to : today();
      const [page, db] = await Promise.all([P.loadPageData({ fetchJson, from, to }), S.db ? loadFromDb(S.db, from, to).catch((e) => { console.warn('keel usage: the database did not load:', e); return null; }) : null]);
      if (seq !== loadSeq) return;
      S.failedFiles = page.failed.length;
      if (page.failed.length) console.warn('keel usage: these page files did not load:', page.failed.join(', '));
      if (!db && !page.index) {
        if (S.db) throw new Error('the database did not load');
        S.mode = 'nodb'; render(); return;
      }
      const all = P.combineSources(db, page);
      S.docs = all.docs; S.machines = all.machines; S.calibs = all.calibs;
      if (all.language) lang = all.language === 'uk' ? 'uk' : 'en';
      derive(); S.mode = 'ready';
    } catch (e) {
      if (seq !== loadSeq) return;
      S.mode = 'error'; S.error = (e && (e.message || e.code)) || String(e);
    }
    render();
  }

  async function boot() {
    const qs = location.search || '';
    const wantDemo = /[?&]demo=1(&|$)/.test(qs);
    let claude = window.claude;
    for (let i = 0, n = wantDemo ? 3 : 30; i < n && !(claude && typeof claude.use === 'function'); i++) { await sleep(100); claude = window.claude; }
    let db = null;
    if (claude && typeof claude.use === 'function') {
      try { db = await claude.use('db'); } catch (e) { db = null; }
      claude.use('downloads').then((d) => { S.downloads = d; if (route().tab === 'sessions') render(); }).catch(() => {});
    }
    if (!db && wantDemo) { loadDemo((/[?&]lang=(en|uk)/.exec(qs) || [])[1] || 'uk'); return; }
    S.db = db;
    await reload();
  }

  // ---- demo fixture (local layout check only) ------------------------------------------------------
  async function loadDemo(l) {
    lang = l === 'en' ? 'en' : 'uk';
    document.documentElement.lang = lang;
    S.demo = true;
    // the demo files go through the same loading path as the real page files
    const { files } = window.KeelUsageDemo(toMs);
    const page = await P.loadPageData({ fetchJson: async (p) => files[p], from: addDays(today(), -60), to: today() });
    const all = P.combineSources(null, page);
    S.docs = all.docs; S.machines = all.machines; S.calibs = all.calibs;
    S.mode = 'ready';
    derive(); render();
  }

  // ---- routing -------------------------------------------------------------------------------------
  const TABS = [['dash', 'tab.dashboard'], ['analysis', 'tab.analysis'], ['sessions', 'tab.sessions'], ['calib', 'tab.calibration']];
  function route() {
    const h = decodeURIComponent((location.hash || '').slice(1));
    if (h.startsWith('s.')) return { tab: 'session', key: h.slice(2) };
    if (TABS.some(([id]) => id === h)) return { tab: h };
    return { tab: 'dash' };
  }

  // ---- charts --------------------------------------------------------------------------------------
  const charts = [];
  function killCharts() { while (charts.length) { try { charts.pop().destroy(); } catch (e) { /* ignore */ } } }
  function mkChart(id, cfg) {
    const el = $(id);
    if (!el || !window.Chart) return null;
    const c = new Chart(el, cfg); charts.push(c); return c;
  }
  // A chart block: title, canvas with a text summary for screen readers, and the same data as a table.
  function chartBox(id, title, summary, table, tall) {
    return `<h3>${esc(title)}</h3><div class="chart${tall ? ' tall' : ''}"><canvas id="${id}" role="img" aria-label="${esc(summary)}"></canvas></div>`
      + `<details class="fallback"${window.Chart ? '' : ' open'}><summary>${esc(t('chart.table'))}</summary><div class="tw">${table}</div></details>`;
  }
  function simpleTable(head, rows) {
    return `<table class="tbl"><thead><tr>${head.map((h, i) => `<th class="${i ? '' : 'L'}">${esc(h)}</th>`).join('')}</tr></thead><tbody>`
      + rows.map((r) => `<tr>${r.map((c, i) => `<td class="${i ? '' : 'L lead'}" data-label="${esc(head[i])}">${esc(c)}</td>`).join('')}</tr>`).join('') + '</tbody></table>';
  }
  function barList(items, fmt) { // items: [{label, value, pct, color?, sub?}]
    const max = Math.max(0, ...items.map((i) => i.value));
    return `<div class="bars">${items.map((i) => `<div class="bar"><span class="k${i.sub ? ' sub' : ''}" title="${esc(i.label)}">${esc(i.label)}</span>`
      + `<span class="track" aria-hidden="true"><span class="fill" style="display:block;width:${max ? Math.max(1, (i.value / max) * 100) : 0}%;background:${i.color || 'var(--accent)'}"></span></span>`
      + `<span class="n">${esc(fmt(i.value))}${i.pct != null ? `<span>${esc(fPct(i.pct, 0))}</span>` : ''}</span></div>`).join('')}</div>`;
  }

  // ---- limits helpers ------------------------------------------------------------------------------
  function latestSnap(field) {
    let best = null;
    for (const s of S.flat.snapshots) if (typeof s[field] === 'number' && (!best || toMs(s.t) > toMs(best.t))) best = s;
    return best;
  }
  const weeklyRate = () => (S.calib && S.calib.weekly && fin(S.calib.weekly.rate) && S.calib.weekly.rate > 0 ? S.calib.weekly.rate : null);
  const fiveRate = () => (S.calib && S.calib.five_hour && fin(S.calib.five_hour.rate) && S.calib.five_hour.rate > 0 ? S.calib.five_hour.rate : null);
  function subUsdSince(ms0, ms1) {
    let usd = 0;
    for (const h of S.flat.hours) { const m = toMs(h.h); if (h.wallet === 'subscription' && m >= ms0 && (ms1 == null || m < ms1)) usd += Number(h.usd) || 0; }
    return usd;
  }
  function limitInfo() {
    const now = Date.now();
    const w = latestSnap('seven_day');
    const f = latestSnap('five_hour');
    const wReset = w ? toMs(w.seven_day_resets_at) : NaN;
    const fReset = f ? toMs(f.five_hour_resets_at) : NaN;
    const weekStart = Number.isFinite(wReset) ? wReset - 7 * 864e5 : now - 7 * 864e5;
    const rate = weeklyRate();
    const wStale = !w || (Number.isFinite(wReset) && wReset < now);
    let forecast = null;
    if (w && !wStale && rate && Number.isFinite(wReset)) {
      const usd48 = subUsdSince(now - 48 * 3600000);
      forecast = Math.round((w.seven_day + (usd48 / 48 / rate) * ((wReset - now) / 3600000)) * 10) / 10;
    }
    return { w, f, wReset, fReset, weekStart, weekUsd: subUsdSince(weekStart), rate, wStale, fStale: !f || (Number.isFinite(fReset) && fReset < now), forecast };
  }

  // ---- views: shared -------------------------------------------------------------------------------
  function emptyAll() {
    return `<div class="empty"><h2>${esc(t('empty.state'))}</h2><p>${esc(t('empty.what'))}</p></div>`;
  }
  const hasAnyData = () => S.flat.sessions.length > 0 || S.flat.hours.length > 0;
  const tile = (l, v, s, hl) => `<div class="tile${hl ? ' hl' : ''}"><span class="l">${esc(l)}</span><span class="v">${esc(v)}</span>${s ? `<span class="s">${s}</span>` : ''}</div>`;

  // ---- Dashboard -----------------------------------------------------------------------------------
  function viewDash() {
    if (!hasAnyData()) return { html: emptyAll() };
    const rows = S.rows;
    const L = limitInfo();
    const allApi = rows.length > 0 && rows.every((r) => r.wallet !== 'subscription');
    let tiles;
    if (allApi) {
      const users = P.share(P.group(rows, 'user'), 'usd');
      const tot = users.reduce((a, g) => a + g.total.usd, 0);
      tiles = tile(t('tile.spent'), fUsd(tot), `${walletChip(rows[0].wallet)} ${esc(fDay(S.range.from))}–${esc(fDay(S.range.to))}`, true)
        + users.slice(0, 3).map((g) => tile(dimLabel('user', g.key), fUsd(g.total.usd), esc(fPct(g.pct, 0)))).join('');
    } else {
      tiles = tile(t('tile.this_week'), L.wStale ? '—' : fPct(L.w.seven_day),
        esc(fUsd(L.weekUsd)) + (L.w ? ' · ' + esc(L.wStale ? t('tile.stale') : t('tile.resets', { when: fDT(L.wReset) })) : ' · ' + esc(t('tile.no_limits'))), true)
        + tile(t('tile.forecast'), L.forecast != null ? '≈' + fPct(L.forecast) : '—', esc(L.forecast != null ? t('tile.forecast_note') : (L.rate ? t('tile.no_limits') : t('tile.no_calibration'))))
        + tile(t('tile.five_hour'), L.fStale ? '—' : fPct(L.f.five_hour, 0), esc(L.f ? (L.fStale ? t('tile.stale') : t('tile.resets', { when: fHM(L.fReset) })) : t('tile.no_limits')))
        + tile(t('tile.rate_label'), L.rate ? t('tile.rate', { usd: fUsd(L.rate) }) : '—', esc(L.rate ? t('tile.rate_n', { n: S.calib.weekly.n || 0 }) : t('tile.no_calibration')));
    }
    if (!rows.length) return { html: `<section class="tiles">${tiles}</section><div class="empty">${esc(t('empty.filtered'))}</div>` };

    // daily $ by model
    const dm = P.dailyByModel(rows);
    const dmTotal = dm.days.map((_, i) => dm.models.reduce((a, m) => a + dm.usd[m][i], 0));
    const dmSummary = `${t('chart.daily_by_model')}: ${dm.days.map((d, i) => `${fDay(d)} ${fUsd(dmTotal[i])}`).join(', ')}`;
    const dmTable = simpleTable([t('chart.day'), ...dm.models, t('common.total')], dm.days.map((d, i) => [fDay(d), ...dm.models.map((m) => fUsd(dm.usd[m][i])), fUsd(dmTotal[i])]));

    // weekly % over time (gaps at resets), forecast dashed to the reset
    const wk = P.weekly(S.flat.snapshots).filter((s) => s.seven_day != null && String(s.t).slice(0, 10) >= S.range.from && String(s.t).slice(0, 10) <= addDays(S.range.to, 1));
    const line = []; let prev = null;
    for (const s of wk) { const x = toMs(s.t); if (prev != null && s.seven_day < prev - 0.5) line.push({ x: x - 1, y: null }); line.push({ x, y: s.seven_day }); prev = s.seven_day; }
    const fc = (L.forecast != null && wk.length) ? [{ x: toMs(wk[wk.length - 1].t), y: wk[wk.length - 1].seven_day }, { x: L.wReset, y: L.forecast }] : [];
    const wkTable = simpleTable([t('cal.col_window'), t('chart.seven_day_pct')], wk.map((s) => [fDT(s.t), fPct(s.seven_day)]).concat(fc.length ? [[t('chart.forecast') + ' ' + fDT(L.wReset), fPct(L.forecast)]] : []));
    const wkSummary = wk.length ? `${t('chart.weekly_pct')}: ${fPct(wk[0].seven_day)} → ${fPct(wk[wk.length - 1].seven_day)}` : t('empty.chart');

    // where the money went
    const mva = P.mainVsAgents(rows);
    const mvaTot = mva.main.usd + mva.agents.usd;
    const mvaItems = [{ label: t('participant.main'), value: mva.main.usd, pct: mvaTot ? mva.main.usd / mvaTot * 100 : 0, color: css('--c1') },
      { label: t('chart.agents'), value: mva.agents.usd, pct: mvaTot ? mva.agents.usd / mvaTot * 100 : 0, color: css('--c2') }]
      .concat(mva.by_type.slice(0, 6).map((g) => ({ label: g.key, value: g.total.usd, pct: mvaTot ? g.total.usd / mvaTot * 100 : 0, color: colorFor('participant', g.key), sub: true })));
    const tk = P.tokenKinds(rows);
    const tkItems = ['cr', 'cw5', 'cw1h', 'in', 'out'].map((k, i) => ({ label: t('tok.' + k), value: tk[k], pct: tk.total ? tk[k] / tk.total * 100 : 0, color: css(PAL[i]) }));
    const tp = P.topProjects(rows, 5);
    const tpTot = rows.reduce((a, r) => a + r.usd, 0);
    const tpItems = tp.map((p) => ({ label: dimLabel('project', p.project), value: p.usd, pct: p.pct, color: colorFor('project', p.project) }));
    const rest = tpTot - tp.reduce((a, p) => a + p.usd, 0);
    if (rest > 0.005) tpItems.push({ label: t('chart.others'), value: rest, pct: tpTot ? rest / tpTot * 100 : 0, color: css('--c5') });
    let usersBlock = '';
    if (allApi || new Set(rows.map((r) => r.user)).size > 1) {
      const us = P.share(P.group(rows, 'user'), 'usd');
      usersBlock = `<div class="panel span-${allApi ? 12 : 6}"><h3>${esc(t('chart.by_user'))}</h3>${barList(us.slice(0, 8).map((g) => ({ label: dimLabel('user', g.key), value: g.total.usd, pct: g.pct, color: colorFor('user', g.key) })), fUsd)}</div>`;
    }

    const bSpan = usersBlock && !allApi ? 'span-6' : 'span-4';
    const html = `<section class="tiles" aria-label="${esc(t('tab.dashboard'))}">${tiles}</section>
      <section class="grid">
        ${allApi ? usersBlock : ''}
        <div class="panel span-${allApi ? 12 : 8}">${chartBox('chDaily', t('chart.daily_by_model'), dmSummary, dmTable, true)}</div>
        ${allApi ? '' : `<div class="panel span-4">${chartBox('chWeek', t('chart.weekly_pct'), wkSummary, wkTable, true)}</div>`}
        <div class="panel ${bSpan}"><h3>${esc(t('chart.main_vs_agents'))}</h3>${barList(mvaItems, fUsd)}</div>
        <div class="panel ${bSpan}"><h3>${esc(t('chart.token_kinds'))}</h3>${barList(tkItems, fTok)}</div>
        <div class="panel ${bSpan}"><h3>${esc(t('chart.top_projects'))}</h3>${barList(tpItems, fUsd)}</div>
        ${allApi ? '' : usersBlock}
      </section>`;
    return {
      html,
      after() {
        mkChart('chDaily', {
          type: 'bar',
          data: { labels: dm.days.map(fDay), datasets: dm.models.map((m) => ({ label: m, data: dm.usd[m], backgroundColor: colorFor('model', m), borderRadius: 2, maxBarThickness: 42 })) },
          options: { plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${fUsd(c.raw)}`, footer: (items) => `${t('common.total')}: ${fUsd(dmTotal[items[0].dataIndex])}` } } },
            scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, ticks: { callback: (v) => fUsd(v) } } } },
        });
        if (!allApi) {
          const xs = line.map((p) => p.x).concat(fc.map((p) => p.x));
          mkChart('chWeek', {
            type: 'line',
            data: { datasets: [
              { label: t('chart.actual'), data: line, borderColor: css('--accent'), backgroundColor: css('--accent-soft'), fill: 'origin', pointRadius: 2, tension: 0.15, spanGaps: false },
              { label: t('chart.forecast'), data: fc, borderColor: css('--accent'), borderDash: [5, 4], pointRadius: [0, 3], fill: false },
            ] },
            options: { parsing: false, plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { title: (it) => fDT(it[0].raw.x), label: (c) => `${c.dataset.label}: ${fPct(c.raw.y)}` } } },
              scales: { x: { type: 'linear', min: xs.length ? Math.min(...xs) : undefined, max: xs.length ? Math.max(...xs) : undefined, grid: { display: false }, ticks: { maxTicksLimit: 6, callback: (v) => fDay(new Date(v).toISOString().slice(0, 10)) } },
                y: { min: 0, suggestedMax: Math.min(100, Math.ceil((Math.max(0, ...line.map((p) => p.y || 0), ...fc.map((p) => p.y)) + 5) / 10) * 10), ticks: { callback: (v) => v + ' %' } } } },
          });
        }
      },
    };
  }

  // ---- Analysis ------------------------------------------------------------------------------------
  const GROUPS = ['day', 'week', 'project', 'pc', 'user', 'participant', 'model', 'hour'];
  const SPLITS = ['none', 'model', 'pc', 'project', 'participant'];
  const TABLE_MEASURES = ['usd', 'tokens', 'tok_in', 'tok_cw5', 'tok_cw1h', 'tok_cr', 'tok_out', 'time_min', 'active_min', 'requests', 'turns', 'sessions'];
  const keyOf = (r, by) => P.group([r], by)[0].key;
  function anFilters() {
    const a = S.an; const one = (v) => (v ? [v] : []);
    return { pc: one(a.pc), user: one(a.user), project: one(a.project), wallet: one(a.wallet), participant: a.participant || null, model: one(a.model) };
  }
  function opts(list, cur, labelFn) {
    return `<option value="">${esc(t('common.all'))}</option>` + list.map((v) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(labelFn ? labelFn(v) : v)}</option>`).join('');
  }
  const uniq = (arr) => [...new Set(arr.filter((x) => x != null && x !== ''))].sort();
  function viewAnalysis() {
    const a = S.an;
    const base = S.rows;
    if (!a.touched && base.length && base.every((r) => r.wallet !== 'subscription') && a.by === 'day') a.by = 'user';
    const types = uniq(base.filter((r) => r.kind !== 'main').map((r) => r.participant));
    const fam = uniq(base.map((r) => P.family(r.model)));
    const sel = (id, label, inner) => `<label class="f" for="${id}">${esc(label)}<select id="${id}" data-an="${id.slice(3)}">${inner}</select></label>`;
    const filtersHtml = `<div class="filters">
      <label class="f" for="anFrom">${esc(t('filter.from'))}<input type="date" id="anFrom" data-range="from" value="${esc(S.range.from)}"></label>
      <label class="f" for="anTo">${esc(t('filter.to'))}<input type="date" id="anTo" data-range="to" value="${esc(S.range.to)}"></label>
      ${sel('an_pc', t('filter.pc'), opts(uniq(base.map((r) => r.pc)), a.pc))}
      ${sel('an_user', t('filter.user'), opts(uniq(base.map((r) => r.user)), a.user))}
      ${sel('an_project', t('filter.project'), opts(uniq(base.map((r) => r.project)), a.project))}
      ${sel('an_wallet', t('filter.wallet'), opts(uniq(base.map((r) => r.wallet)), a.wallet, walletName))}
      ${sel('an_participant', t('filter.participant'), `<option value="">${esc(t('common.all'))}</option><option value="main"${a.participant === 'main' ? ' selected' : ''}>${esc(t('participant.main'))}</option><option value="agents"${a.participant === 'agents' ? ' selected' : ''}>${esc(t('participant.agents'))}</option>` + types.map((v) => `<option value="${esc(v)}"${v === a.participant ? ' selected' : ''}>${esc(v)}</option>`).join(''))}
      ${sel('an_model', t('filter.model'), opts(fam, a.model))}
    </div>
    <div class="filters wide">

      <dt>${esc(t('cache.read'))}</dt><dd>${esc(fTok(c.cr))}</dd>
      <dt>${esc(t('cache.write5'))}</dt><dd>${esc(fTok(c.cw5))}</dd>
      <dt>${esc(t('cache.write1h'))}</dt><dd>${esc(fTok(c.cw1h))}</dd>
      <dt>${esc(t('tok.in'))} / ${esc(t('tok.out'))}</dt><dd>${esc(fTok(c.in))} / ${esc(fTok(c.out))}</dd></dl></div>`;
    const meta = [[t('sp.date'), fDate(s.start || s.date)], [t('sp.started') + '–' + t('sp.ended').toLowerCase(), `${fHM(s.start)}–${fHM(s.end)}`], [t('sp.pc'), s.pc], [t('sp.user'), s.user || '—'], [t('sp.branch'), s.branch || '—'], [t('sp.entrypoint'), s.entrypoint || '—']]
      .map(([k, v]) => `<span>${esc(k)}: <b>${esc(v)}</b></span>`).join('');
    const html = `${back}
      <section style="display:grid;gap:8px"><div class="sp-head"><h2>${esc(title)}</h2>${s.keel && s.keel.level ? `<span class="chip level">${esc(cap(s.keel.level))}</span>` : ''}${walletChip(s.wallet)}</div><div class="meta">${meta}</div></section>
      <section class="tiles sm">${tiles}</section>
      <section class="panel"><h3>${esc(t('sp.timeline'))}</h3><div class="lanes">${lanes}<div class="lane"><span></span><div class="axis">${ticks}</div></div></div>${legend}</section>
      <section><h3>${esc(t('sp.participants'))}</h3>${pTable}</section>
      <section><h3>${esc(t('sp.turns'))}</h3>${turns}</section>
      <section class="grid"><div class="panel span-6"><h3>${esc(t('sp.tools'))}</h3>${tools}</div>${keelBlock}${cacheBlock}</section>`;
    return { html };
  }

  // ---- Calibration ---------------------------------------------------------------------------------
  function viewCalib() {
    const c = S.calib;
    const pts = c ? [].concat(((c.weekly && c.weekly.points) || []).map((p) => Object.assign({}, p, { kind: 'weekly' })), ((c.five_hour && c.five_hour.points) || []).map((p) => Object.assign({}, p, { kind: 'five_hour' }))) : [];
    const v = P.calibrationView(pts, S.machines.map((m) => ({ pc: m.name || m.pc, synced_until: m.synced_until, last_seen: m.last_seen })), Date.now());
    const waiting = new Set([].concat(v.waiting, (c && c.waiting) || []));
    const wRate = c && c.weekly && fin(c.weekly.rate) ? c.weekly.rate : v.medians.weekly;
    const fRate = c && c.five_hour && fin(c.five_hour.rate) ? c.five_hour.rate : v.medians.five_hour;
    const dropped = v.rows.filter((r) => r.status === 'dropped').length;
    const tiles = `<section class="tiles">
      ${tile(t('cal.median_weekly'), wRate ? t('tile.rate', { usd: fUsd(wRate) }) : '—', esc(wRate ? t('tile.rate_n', { n: (c && c.weekly && c.weekly.n) || 0 }) : t('cal.none')), true)}
      ${tile(t('cal.median_five_hour'), fRate ? t('tile.rate', { usd: fUsd(fRate) }) : '—', esc(fRate ? t('tile.rate_n', { n: (c && c.five_hour && c.five_hour.n) || 0 }) : t('cal.none')))}
      ${tile(t('cal.dropped_n'), fInt(dropped), esc(t('cal.dropped_of', { n: dropped, total: v.rows.length })))}
    </section>`;
    const L = { kind: t('cal.kind'), win: t('cal.col_window'), gain: t('cal.col_gain'), usd: t('cal.col_usd'), rate: t('cal.col_rate'), st: t('cal.col_status') };
    const win = (r) => { const a = toMs(r.from); const b = toMs(r.to); return new Date(a).toDateString() === new Date(b).toDateString() ? `${fDT(a)}–${fHM(b)}` : `${fDT(a)} – ${fDT(b)}`; };
    const points = v.empty
      ? `<div class="empty"><h2>${esc(cap(t('cal.none')))}</h2><p>${esc(t('cal.none_hint'))}</p></div>`
      : `<div class="tw"><table class="tbl"><thead><tr><th class="L" scope="col">${esc(L.kind)}</th><th class="L" scope="col">${esc(L.win)}</th><th scope="col">${esc(L.gain)}</th><th scope="col">${esc(L.usd)}</th><th scope="col">${esc(L.rate)}</th><th class="L" scope="col">${esc(L.st)}</th></tr></thead><tbody>`
        + v.rows.map((r) => `<tr><td class="L lead">${esc(t('cal.kind_' + r.kind))}</td><td class="L" data-label="${esc(L.win)}">${esc(win(r))}</td>
          <td data-label="${esc(L.gain)}">+${esc(nf(Number(r.gain) || 0, 1))}</td><td data-label="${esc(L.usd)}">${esc(fUsd(r.usd))}</td>
          <td data-label="${esc(L.rate)}">${esc(r.rate > 0 ? fUsd(r.rate) : '—')}</td>
          <td class="L wrap" data-label="${esc(L.st)}"><span><span class="chip ${r.status}">${esc(t('cal.' + r.status))}</span>${r.reason && r.status !== 'kept' ? ` <span class="muted">${esc(t('cal.reason.' + r.reason))}</span>` : ''}</span></td></tr>`).join('')
        + '</tbody></table></div>';
    const ML = { pc: t('col.pc'), sync: t('cal.last_sync'), seen: t('cal.last_seen'), st: t('cal.state') };
    const machines = v.machines.length ? `<div class="tw"><table class="tbl"><thead><tr><th class="L" scope="col">${esc(ML.pc)}</th><th scope="col">${esc(ML.sync)}</th><th scope="col">${esc(ML.seen)}</th><th class="L" scope="col">${esc(ML.st)}</th></tr></thead><tbody>`
      + v.machines.map((m) => `<tr><td class="L lead">${esc(m.pc)}</td><td data-label="${esc(ML.sync)}">${esc(fDT(m.synced_until))}</td><td data-label="${esc(ML.seen)}">${esc(fDT(m.last_seen))}</td>
        <td class="L" data-label="${esc(ML.st)}">${waiting.has(m.pc) ? `<span class="chip pending">${esc(t('cal.waiting_for', { pc: m.pc }))}</span>` : `<span class="chip kept">${esc(t('cal.synced'))}</span>`}</td></tr>`).join('')
      + '</tbody></table></div>' : '<p class="muted">—</p>';
    const head = `<div class="sec-head"><h2>${esc(t('cal.title'))}</h2>${c ? `<span class="small muted">${esc(t('cal.computed_by', { pc: c.pc, when: fDT(c.computed_at) }))}</span>` : ''}</div>`;
    return { html: `${head}${tiles}<section><h3>${esc(t('cal.points'))}</h3>${points}</section><section><h3>${esc(t('cal.machines'))}</h3>${machines}</section>` };
  }

  // ---- shell ---------------------------------------------------------------------------------------
  function renderHeader(r) {
    $('tabs').setAttribute('aria-label', t('app.title'));
    $('tabs').innerHTML = TABS.map(([id, k]) => `<a href="#${id}"${r.tab === id || (r.tab === 'session' && id === 'sessions') ? ' aria-current="page"' : ''}>${esc(t(k))}</a>`).join('');
    const rg = $('range');
    rg.hidden = !(S.mode === 'ready') || r.tab === 'analysis' || r.tab === 'session' || r.tab === 'calib';
    if (!rg.hidden) {
      rg.innerHTML = `<label class="sr" for="rgPreset">${esc(t('range.label'))}</label><select id="rgPreset" data-range="preset">${['7', '30', '90', 'custom'].map((p) => `<option value="${p}"${S.range.preset === p ? ' selected' : ''}>${esc(t('range.' + p))}</option>`).join('')}</select>
        <label class="sr" for="rgFrom">${esc(t('filter.from'))}</label><input type="date" id="rgFrom" data-range="from" value="${esc(S.range.from)}">
        <label class="sr" for="rgTo">${esc(t('filter.to'))}</label><input type="date" id="rgTo" data-range="to" value="${esc(S.range.to)}">`;
    }
    $('banner').innerHTML = (S.demo ? `<div class="banner">${esc(t('demo.banner'))}</div>` : '')
      + (S.mode === 'ready' && S.failedFiles ? `<p class="small muted">${esc(t('load.partial'))}</p>` : '');
  }
  let current = null;
  function render() {
    const r = route();
    document.documentElement.lang = lang;
    renderHeader(r);
    killCharts();
    chartDefaults();
    if (S.mode === 'loading') { VIEW.innerHTML = `<div class="loading">${esc(t('app.loading'))}</div>`; return; }
    if (S.mode === 'nodb') { VIEW.innerHTML = `<div class="empty"><h2>${esc(t('nodb.title'))}</h2><p>${esc(t('nodb.text'))}</p><p class="small">${esc(t('nodb.demo'))}</p></div>`; return; }
    if (S.mode === 'error') { VIEW.innerHTML = `<div class="empty"><h2>${esc(t('app.error', { message: S.error }))}</h2></div>`; return; }
    const v = r.tab === 'analysis' ? viewAnalysis() : r.tab === 'sessions' ? viewSessions() : r.tab === 'calib' ? viewCalib() : r.tab === 'session' ? viewSession(r.key) : viewDash();
    current = v;
    VIEW.innerHTML = v.html;
    if (v.after) v.after();
  }

  // ---- events --------------------------------------------------------------------------------------
  let rangeTimer = null;
  function setRange(field, value) {
    if (field === 'preset') {
      S.range.preset = value;
      if (value !== 'custom') { const n = Number(value); S.range.from = addDays(today(), -(n - 1)); S.range.to = today(); }
    } else if (/^\d{4}-\d{2}-\d{2}$/.test(value)) { S.range[field] = value; S.range.preset = 'custom'; } else return;
    if (S.range.from > S.range.to) { const x = S.range.from; S.range.from = S.range.to; S.range.to = x; }
    store.set('range', S.range);
    clearTimeout(rangeTimer);
    rangeTimer = setTimeout(reload, 300);
  }
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.dataset.range) { setRange(el.dataset.range, el.value); return; }
    if (el.dataset.an) { S.an[el.dataset.an] = el.value; S.an.touched = true; store.set('an', S.an); render(); restoreFocus(el.id); return; }
    if (el.dataset.ss && el.dataset.ss !== 'search') { S.ss[el.dataset.ss] = el.value; store.set('ss', S.ss); render(); restoreFocus(el.id); }
  });
  let searchTimer = null;
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.dataset.ss === 'search') {
      S.ss.search = el.value; store.set('ss', S.ss);
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { const pos = el.selectionStart; render(); const n = $('ss_search'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) { /* ignore */ } } }, 250);
    }
  });
  function restoreFocus(id) { const n = id && $(id); if (n) n.focus(); }
  VIEW.addEventListener('click', (e) => {
    const el = e.target.closest('button, a, tr');
    if (!el) return;
    if (el.id === 'spBack') { if (S.lastTab && history.length > 1) history.back(); else location.hash = '#sessions'; return; }
    if (el.id === 'ssExport') { const d = sessionsData(); exportCsv(d.rows); return; }
    if (el.id === 'ssDrillClear') { S.ss.drill = null; store.set('ss', S.ss); render(); return; }
    if (el.dataset.sort) {
      const c = el.dataset.sort;
      if (S.ss.sort === c) S.ss.dir = S.ss.dir === 'asc' ? 'desc' : 'asc'; else { S.ss.sort = c; S.ss.dir = ['usd', 'week_pct', 'date'].includes(c) ? 'desc' : 'asc'; }
      store.set('ss', S.ss); render(); restoreFocus(null);
      const b = VIEW.querySelector(`button[data-sort="${c}"]`); if (b) b.focus();
      return;
    }
    if (el.dataset.drill != null && current && current.drill) { current.drill(Number(el.dataset.drill)); return; }
    if (el.tagName === 'TR' && el.dataset.key && !e.target.closest('a')) { location.hash = '#s.' + el.dataset.key; }
  });
  window.addEventListener('hashchange', () => {
    const r = route();
    if (r.tab !== 'session') S.lastTab = r.tab;
    render();
    if (r.tab === 'session') window.scrollTo(0, 0);
  });
  // re-color charts when the theme changes
  const rerender = () => { if (S.mode === 'ready') render(); };
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', rerender); } catch (e) { /* old browsers */ }
  new MutationObserver(rerender).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  S.lastTab = route().tab === 'session' ? null : route().tab;
  render();
  boot();
})();
</script>
