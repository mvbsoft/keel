<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="keel-feature-repo" content="{{MARKER}}">
<meta name="keel-feature-lang" content="{{LANG}}">
<script type="application/json" id="feature-translations">{{TRANSLATIONS}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* keel's feature page. A computer: on the left the feature, what is in work and the list of tickets;
   on the right the chosen ticket, its sections as blocks. A phone: the same left column, and a ticket
   opens over it. The data comes from feature-page.js in the JSON block below; every label from
   locales/<code>.json through it. */
:root {
  --bg: #eef2f2; --card: #ffffff; --ink: #18232a; --muted: #56656d; --faint: #6f7d83; --line: #d9e2e3; --band: #e5ecec;
  --accent: #0f766e; --accent-soft: #dcf2ee;
  --done: #1f7a4d; --done-soft: #e1f3e9; --doing: #2160a6; --doing-soft: #e4eef9;
  --wait: #7a5a00; --wait-soft: #f6eccc; --risk: #b03b4a; --risk-soft: #f9e5e8;
  --scrim: rgb(15 22 25 / .5); --pop: #ffffff;
  --code-bg: #e9eef0; --code-ink: #2f3f8f; --pre-bg: #1b2530; --pre-ink: #dce6f2;
  --hl-key: #ffcf8a; --hl-str: #b5e8a3; --hl-fn: #8fd3ff; --hl-com: #8b9bb0; --hl-num: #f5a3c7;
  --gh-bg: #0d1117; --gh-ink: #e6edf3; --gh-muted: #9198a1; --gh-line: #30363d; --gh-pre: #151b23; --gh-code: rgb(101 108 118 / .3); --gh-link: #4493f8;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1619; --card: #172226; --ink: #e3ebec; --muted: #9aaeb3; --faint: #82959a; --line: #29393e; --band: #1f2d32;
    --accent: #5fd4c4; --accent-soft: #133430;
    --done: #74d2a0; --done-soft: #17332a; --doing: #8bbcf0; --doing-soft: #1b2c40;
    --wait: #e8c35c; --wait-soft: #352d15; --risk: #f0919c; --risk-soft: #3a1e24;
    --scrim: rgb(0 0 0 / .62); --pop: #24343b;
    --code-bg: #22303a; --code-ink: #c2c8ff; --pre-bg: #0a1014; --pre-ink: #dce6f2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1619; --card: #172226; --ink: #e3ebec; --muted: #9aaeb3; --faint: #82959a; --line: #29393e; --band: #1f2d32;
  --accent: #5fd4c4; --accent-soft: #133430;
  --done: #74d2a0; --done-soft: #17332a; --doing: #8bbcf0; --doing-soft: #1b2c40;
  --wait: #e8c35c; --wait-soft: #352d15; --risk: #f0919c; --risk-soft: #3a1e24;
  --scrim: rgb(0 0 0 / .62); --pop: #24343b;
  --code-bg: #22303a; --code-ink: #c2c8ff; --pre-bg: #0a1014; --pre-ink: #dce6f2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--font-body); -webkit-text-size-adjust: 100%; }
body.locked { overflow: hidden; }
.page { max-width: 760px; margin: 0 auto; padding-block: 16px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, p, ul, ol { margin: 0; }
h1, h2, h3 { line-height: 1.25; text-wrap: balance; }
h1 { font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
h2 { font-size: 21px; font-weight: 600; }
h3 { font-size: 16px; font-weight: 600; }
a { color: var(--doing); text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--font-mono); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.rowline { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; min-width: 0; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.layout { display: flex; flex-direction: column; gap: 14px; }
.side, .detail-col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card { background: var(--card); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }

.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--accent); background: var(--accent-soft); padding: 2px 10px; border-radius: 99px; }
.featname { font: 500 13px var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
.chip { display: inline-flex; align-items: center; gap: 5px; font: 500 13px/1.5 var(--font-body); padding: 2px 10px; border-radius: 99px;
  border: 1px solid var(--line); color: var(--muted); white-space: nowrap; background: none; }
.dhead .chip, .status .chip { white-space: normal; overflow-wrap: anywhere; max-width: 100%; }
button.chip { cursor: pointer; }
button.chip:hover, button.chip[aria-expanded="true"] { border-color: var(--accent); color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 4px; font: 500 13px/1.5 var(--font-body); padding: 2px 10px; border-radius: 99px; white-space: nowrap; background: var(--band); color: var(--muted); }
.s-done { background: var(--done-soft); color: var(--done); }
.s-waiting { background: var(--wait-soft); color: var(--wait); }
.s-doing { background: var(--doing-soft); color: var(--doing); }
.s-next { background: var(--accent-soft); color: var(--accent); }
.s-unknown { background: var(--band); color: var(--muted); }
/* A state, of a ticket or of a dependency: one shape, a dot in its colour and its word. */
.pill.st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.pill.st.s-unknown::before { background: none; box-shadow: inset 0 0 0 1.5px currentColor; }
/* A mark, not a state: why a ticket's state is unknown ("not on this machine"). */
.pill.off { font-size: 12px; padding: 1px 8px; cursor: help; background: none; color: var(--wait); border: 1px solid var(--wait); }
.pill.off svg { width: 14px; height: 14px; }
.item:has(.off) { grid-template-columns: 10px max-content minmax(0, 1fr) max-content; }
.s-draft { background: var(--wait-soft); color: var(--wait); }
.s-risk { background: var(--risk-soft); color: var(--risk); }
.key { font: 500 13px/1.4 var(--font-mono); padding: 1px 7px; border: 1px solid var(--line); border-radius: 6px; white-space: nowrap; }
/* "N projects" and "as of": a small window under the chips, over the page; its cross or a click elsewhere
   closes it. */
.chips { position: relative; }
.popwrap { display: inline-flex; }
.float { position: absolute; top: calc(100% + 6px); left: 0; z-index: 45; width: max-content; min-width: 220px; max-width: min(340px, 100%);
  background: var(--pop); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 28px rgb(0 0 0 / .28);
  padding: 12px 38px 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.float .r { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.float .fx { position: absolute; top: 6px; right: 6px; background: none; border: 0; padding: 3px; cursor: pointer; color: var(--muted); border-radius: 6px; display: inline-flex; }
.float .fx:hover { color: var(--ink); }
.more { align-self: flex-start; background: none; border: 0; padding: 0; color: var(--doing); cursor: pointer; font-size: 14px; }
.more:hover { text-decoration: underline; }
.lead { color: var(--muted); font-size: 15px; }
.lead.clamp .md { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.note { background: var(--wait-soft); color: var(--wait); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
.tnote { font-size: 13px; color: var(--faint); }

.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--card); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn .n { font: 500 12px var(--font-mono); color: var(--faint); }

.status { border: 2px solid var(--doing); }
.status.next { border-color: var(--accent); }
.status.done { border-color: var(--done); }
.status .head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--doing); }
.status.next .head { color: var(--accent); } .status.done .head { color: var(--done); }
.status .head > .t { flex: 1; }
.focusitem { display: flex; flex-direction: column; gap: 6px; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.focusitem .t { font-weight: 600; }
.focusitem:hover .t { text-decoration: underline; }
.hint { font-size: 13px; color: var(--faint); overflow-wrap: anywhere; }
.bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--band); }
.bar span { display: block; height: 100%; }
.bar .done { background: var(--done); } .bar .waiting { background: var(--wait); } .bar .doing { background: var(--doing); }

.list { gap: 2px; padding-inline: 10px; }
.list > h2 { font-size: 16px; padding: 0 6px 4px; }
.grp { display: flex; align-items: center; gap: 8px; padding: 10px 6px 4px; font: 600 12px var(--font-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--faint); }
.grp .sp { flex: 1; }
.grp .cnt { font: 500 12px var(--font-body); text-transform: none; letter-spacing: 0; }
.item { display: grid; grid-template-columns: 10px max-content minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; width: 100%;
  background: none; border: 0; border-radius: 8px; padding: 8px 8px; cursor: pointer; font-size: 15px; }
.item:hover { background: var(--band); }
.item[aria-current="true"] { background: var(--accent-soft); }
.item .k { font: 500 12px var(--font-mono); color: var(--muted); }
.item .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.dot.done { background: var(--done); } .dot.waiting { background: var(--wait); } .dot.doing { background: var(--doing); }
.dot.next { background: var(--accent); } .dot.draft { background: var(--wait); } .dot.unknown { background: none; border: 1.5px dashed var(--faint); }

.detail { gap: 14px; }
.back { display: none; align-self: flex-start; background: none; border: 0; padding: 4px 0; color: var(--doing); cursor: pointer; font-size: 15px; }
.dhead { display: flex; flex-direction: column; gap: 8px; }
.dhead .sp { flex: 1; }
.block { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; scroll-margin-top: 12px; }
.block.plain { background: var(--band); border-color: transparent; }
.block.trap { background: var(--risk-soft); border-color: transparent; }
.block.trap .bh { color: var(--risk); }
.block.example { background: var(--doing-soft); border-color: transparent; }
.bh { display: flex; align-items: center; gap: 8px; font: 600 12px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.bh .t { flex: 1; }
/* ⓘ: its text as a tooltip, on hover with a mouse, on a tap on a phone. */
.infowrap { position: relative; display: inline-flex; }
.info { background: none; border: 0; padding: 2px; cursor: pointer; color: var(--faint); border-radius: 6px; display: inline-flex; }
.info:hover, .infowrap.open .info { color: var(--accent); }
.infowrap .bubble { position: absolute; top: calc(100% + 6px); right: -4px; z-index: 40; width: max-content; max-width: min(320px, calc(100vw - 72px));
  background: var(--ink); color: var(--card); font: 400 14px/1.5 var(--font-body); letter-spacing: 0; text-transform: none; text-align: left;
  padding: 10px 12px; border-radius: 10px; box-shadow: 0 6px 24px rgb(0 0 0 / .25); visibility: hidden; opacity: 0; }
.infowrap.open .bubble, .infowrap:has(.info:focus-visible) .bubble { visibility: visible; opacity: 1; }
@media (hover: hover) { .infowrap:hover .bubble { visibility: visible; opacity: 1; } }
.goal { display: flex; gap: 8px; align-items: baseline; font-size: 15px; padding-top: 6px; border-top: 1px solid var(--line); }
.goal .lb { color: var(--faint); flex: none; font-size: 13px; }
.bounds { display: grid; grid-template-columns: 1fr; gap: 8px; }
.bound { border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.bound b { font: 600 12px var(--font-mono); text-transform: uppercase; letter-spacing: .05em; }
.bound.always { background: var(--done-soft); } .bound.always b { color: var(--done); }
.bound.ask { background: var(--wait-soft); } .bound.ask b { color: var(--wait); }
.bound.never { background: var(--risk-soft); } .bound.never b { color: var(--risk); }
.oos { display: flex; gap: 8px; align-items: baseline; font-size: 15px; color: var(--muted); }
.oos .lb { color: var(--faint); font-size: 13px; flex: none; }
.dec { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 12px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; scroll-margin-top: 8px; }
.dec.hit { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.dec .what { font-weight: 600; }
.dec .why { grid-column: 2; color: var(--muted); font-size: 15px; }
.dref { font: inherit; color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 5px; padding: 0 4px; cursor: pointer; }
.dep { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: none; text-align: left; cursor: pointer; width: 100%; }
.dep:hover { border-color: var(--accent); }

.md { display: flex; flex-direction: column; gap: 8px; min-width: 0; overflow-wrap: anywhere; }
.md ul, .md ol { padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; }
.md li > ul, .md li > ol { margin-top: 4px; }
.md h1, .md h2, .md h3, .md h4 { font-size: 16px; font-weight: 600; }
.md code { font-family: var(--font-mono); font-size: .86em; background: var(--code-bg); color: var(--code-ink); padding: .1em .4em; border-radius: 5px; }
.md pre, pre.raw { margin: 0; padding: 12px 14px; background: var(--pre-bg); color: var(--pre-ink); border-radius: 10px; overflow-x: auto; font: 13.5px/1.6 var(--font-mono); }
pre.raw { white-space: pre-wrap; }
.md pre code { background: none; color: inherit; padding: 0; font-size: inherit; overflow-wrap: normal; }
.md blockquote { margin: 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
.md table { border-collapse: collapse; font-size: 14px; }
.md .tablewrap { overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
.md input[type="checkbox"] { width: 16px; height: 16px; margin: 0 8px 0 0; vertical-align: -2px; accent-color: var(--accent); }
.md li:has(> input[type="checkbox"]) { list-style: none; margin-left: -1.3em; }
.hljs-keyword, .hljs-selector-tag, .hljs-built_in, .hljs-type { color: var(--hl-key); }
.hljs-string, .hljs-attr, .hljs-symbol, .hljs-template-variable { color: var(--hl-str); }
.hljs-title, .hljs-function, .hljs-section, .hljs-name { color: var(--hl-fn); }
.hljs-comment, .hljs-quote, .hljs-meta { color: var(--hl-com); font-style: italic; }
.hljs-number, .hljs-literal, .hljs-variable { color: var(--hl-num); }

.part { display: flex; flex-direction: column; gap: 6px; scroll-margin-top: 8px; }
.part.hit { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 6px; }
.lbl { font: 600 12px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.part.trap { background: var(--risk-soft); border-radius: 10px; padding: 12px 14px; } .part.trap .lbl { color: var(--risk); }
.part.example { background: var(--doing-soft); border-radius: 10px; padding: 12px 14px; } .part.example .lbl { color: var(--doing); }
.report { display: flex; flex-direction: column; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.report:last-child { border-bottom: 0; }

.scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--card); border-radius: 16px; width: 100%; max-width: 860px; max-height: 88vh; display: flex; flex-direction: column; min-width: 0; box-shadow: 0 12px 40px rgb(0 0 0 / .3); }
.sheet .top { display: flex; align-items: flex-start; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
.sheet .top .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.sheet .top .sub { font: 500 13px var(--font-mono); color: var(--faint); overflow-wrap: anywhere; }
.sheet .x { background: none; border: 0; padding: 4px; cursor: pointer; color: var(--muted); border-radius: 8px; }
.sheet .x .ic { width: 22px; height: 22px; }
.sheet .content { padding: 16px 18px 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }

/* The md file in its window: dark in both themes, as GitHub's dark theme draws markdown. */
.sheet.ghfile { background: var(--gh-bg); color: var(--gh-ink); color-scheme: dark; }
.sheet.ghfile .top { border-color: var(--gh-line); }
.sheet.ghfile .top .sub, .sheet.ghfile .x { color: var(--gh-muted); }
.gh { gap: 16px; font-size: 16px; line-height: 1.6; color: var(--gh-ink); }
.gh h1, .gh h2 { font-weight: 600; padding-bottom: .3em; border-bottom: 1px solid var(--gh-line); }
.gh h1 { font-size: 1.9em; } .gh h2 { font-size: 1.45em; margin-top: 8px; } .gh h3 { font-size: 1.2em; } .gh h4 { font-size: 1em; }
.gh a { color: var(--gh-link); }
.gh code { background: var(--gh-code); color: var(--gh-ink); }
.gh pre { background: var(--gh-pre); color: var(--gh-ink); border: 1px solid var(--gh-line); }
.gh blockquote { border-left: 4px solid var(--gh-line); color: var(--gh-muted); padding-left: 1em; }
.gh table { border-collapse: collapse; }
.gh th, .gh td { border: 1px solid var(--gh-line); padding: 6px 13px; }
.gh th { font-weight: 600; }
.gh tr:nth-child(2n) td { background: var(--gh-pre); }
.gh hr { border: 0; height: 4px; background: var(--gh-line); }
.gh input[type="checkbox"] { accent-color: var(--gh-link); }
.gh .fm th { font: 500 13px var(--font-mono); color: var(--gh-muted); }
.gh .fm td { font: 13px var(--font-mono); }
.gh .tnote { color: var(--gh-muted); }
.mmd { overflow-x: auto; padding: 8px 0; text-align: center; }
.mmd svg { max-width: 100%; height: auto; }
.mmd.failed { text-align: left; }

.tip { border-bottom: 2px dotted var(--accent); cursor: help; }
.tip .bubble { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 70; max-width: 560px; margin: 0 auto;
  background: var(--ink); color: var(--card); font: 400 15px/1.5 var(--font-body); padding: 12px 14px; border-radius: 10px;
  box-shadow: 0 6px 24px rgb(0 0 0 / .25); visibility: hidden; opacity: 0; }
.tip:hover .bubble, .tip:focus .bubble { visibility: visible; opacity: 1; }
@media (prefers-reduced-motion: no-preference) { .tip .bubble { transition: opacity .12s; } }
footer { color: var(--faint); font-size: 13px; text-align: center; padding-top: 18px; }

/* A phone or a narrow window: the list, and a ticket opened over it with a way back. */
@media (max-width: 1099px) {
  body.reading .side { display: none; }
  body:not(.reading) .detail-col { display: none; }
  .back { display: inline-flex; gap: 6px; align-items: center; }
}
@media (max-width: 640px) {
  .scrim { align-items: flex-end; padding: max(24px, env(safe-area-inset-top, 0px)) 0 0; }
  .sheet { max-width: none; border-radius: 16px 16px 0 0; }
  .sheet .content { padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
}
@media (min-width: 760px) { .bounds { grid-template-columns: repeat(3, 1fr); } }
/* A computer: the left column stays in place; the ticket beside it. */
@media (min-width: 1100px) {
  .page { max-width: 1480px; padding-block: 24px 48px; }
  .layout { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 24px; align-items: start; }
  .side { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; scrollbar-width: thin; }
  .detail { padding: 24px 28px; }
  .detail .md, .detail .lead { max-width: 86ch; }
  h2.ttl { font-size: 26px; }
}
</style>

<div class="page" id="app"><p class="muted">…</p></div>

<script type="application/json" id="feature-data">{{DATA}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" integrity="sha512-xeUh+KxNyTufZOje++oQHstlMQ8/rpyzPuM+gjMFYK3z5ILJGE7l2NvYL+XfliKURMpBIKKp1XoPN/qswlSMFA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" integrity="sha512-jB0TkTBeQC9ZSkBqDhdmfTv1qdfbWpGE72yJ/01Srq6hEzZIz2xkz1e57p9ai7IeHMwEG7HpzG6NdptChif5Pg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js" integrity="sha512-6yoqbrcLAHDWAdQmiRlHG4+m0g/CT/V9AGyxabG8j7Jk8j3r3K6due7oqpiRMZqcYe9WM2gPcaNNxnl2ux+3tA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
(function () {
  'use strict';
  const data = JSON.parse(document.getElementById('feature-data').textContent);
  let rules;
  try { rules = new Intl.PluralRules(data.language); } catch { rules = new Intl.PluralRules('en'); }
  // A label from locales/<code>.json (page.* keys): {name} placeholders, plural forms by vars.n.
  function L(key, vars = {}) {
    let m = data.labels[key];
    if (m === undefined) return key;
    if (m && typeof m === 'object') m = m[rules.select(vars.n)] ?? m.other;
    return String(m).replace(/\{(\w+)\}/g, (s, k) => (vars[k] == null ? s : String(vars[k])));
  }
  const snake = (name) => name.toLowerCase().replace(/[^a-z]+/g, '_').replace(/^_|_$/g, '');
  const sectionName = (n) => (data.labels[`section.${snake(n)}`] !== undefined ? L(`section.${snake(n)}`) : n);
  const STATE_KEYS = { done: 'done', 'waiting for the feature merge': 'waiting_feature', 'waiting for merge into the feature branch': 'waiting_branch',
    'in progress': 'in_progress', 'to do': 'to_do', next: 'next', draft: 'draft', 'draft (ready)': 'draft_ready', exported: 'exported',
    'state unknown': 'unknown', 'not found': 'not_found', 'not checked': 'not_checked' };
  const stateText = (s) => (STATE_KEYS[s] ? L(`state.${STATE_KEYS[s]}`) : s);
  // The page's state groups: the counts, the bar and each ticket's colour.
  const GROUP_OF = { done: 'done', 'waiting for the feature merge': 'waiting', 'waiting for merge into the feature branch': 'waiting',
    'in progress': 'doing', 'to do': 'todo', draft: 'draft' };
  const groupOf = (t) => (t.next ? 'next' : GROUP_OF[t.state] || 'unknown');
  const PILL = { done: 's-done', waiting: 's-waiting', doing: 's-doing', next: 's-next', todo: '', draft: 's-draft', unknown: 's-unknown' };
  const groupText = (g) => ({ done: L('state.done'), waiting: L('state.waiting'), doing: L('state.in_progress'), next: L('state.to_do'),
    todo: L('state.to_do'), draft: L('state.draft'), unknown: L('state.unknown') })[g];
  const countGroup = (g) => (g === 'next' ? 'todo' : g);
  const draft = data.stage.startsWith('draft');

  // Tabler icons (MIT), outline paths.
  const ICONS = {
    check: '<path d="M3 5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="m9 12 2 2 4-4"/>',
    play: '<path d="M7 4v16l13-8z"/>',
    terminal: '<path d="m5 7 5 5-5 5m7 2h7"/>',
    folder: '<path d="M5 4h4l3 3h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2"/>',
    shield: '<path d="M12 3a12 12 0 0 0 8.5 3A12 12 0 0 1 12 21 12 12 0 0 1 3.5 6 12 12 0 0 0 12 3"/>',
    bulb: '<path d="M3 12h1m8-9v1m8 8h1M5.6 5.6l.7.7m12.1-.7-.7.7M9 16a5 5 0 1 1 6 0 3.5 3.5 0 0 0-1 3 2 2 0 0 1-4 0 3.5 3.5 0 0 0-1-3m.7 1h4.6"/>',
    link: '<path d="m9 15 6-6m-4-3 .5-.5a5 5 0 0 1 7 7l-.5.5m-5 5-.4.5a5 5 0 0 1-7-7L6 13"/>',
    file: '<path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2M9 9h1m-1 4h6m-6 4h6"/>',
    alert: '<path d="M12 9v4m-1.6-9.1L2.3 17.5a1.9 1.9 0 0 0 1.6 2.9h16.2a1.9 1.9 0 0 0 1.6-2.9L13.6 3.9a1.9 1.9 0 0 0-3.2 0M12 16h.01"/>',
    x: '<path d="M18 6 6 18M6 6l12 12"/>',
    info: '<path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0m9-3h.01M11 12h1v4h1"/>',
    braces: '<path d="M7 4a2 2 0 0 0-2 2v3a2 3 0 0 1-2 3 2 3 0 0 1 2 3v3a2 2 0 0 0 2 2m10-16a2 2 0 0 1 2 2v3a2 3 0 0 0 2 3 2 3 0 0 0-2 3v3a2 2 0 0 1-2 2"/>',
    stairs: '<path d="M22 5h-5v5h-5v5H7v5H2"/>',
    ban: '<path d="M3 12a9 9 0 1 0 18 0 9 9 0 1 0-18 0M5.7 5.7l12.6 12.6"/>',
    book: '<path d="M3 19a9 9 0 0 1 9 0 9 9 0 0 1 9 0M3 6a9 9 0 0 1 9 0 9 9 0 0 1 9 0M3 6v13m9-13v13m9-13v13"/>',
    search: '<path d="M3 10a7 7 0 1 0 14 0 7 7 0 1 0-14 0m18 11-6-6"/>',
    list: '<path d="M9 6h11M9 12h11M9 18h11M5 6v.01M5 12v.01M5 18v.01"/>',
    commit: '<path d="M9 12a3 3 0 1 0 6 0 3 3 0 1 0-6 0m3-9v6m0 6v6"/>',
    branch: '<path d="M5 18a2 2 0 1 0 4 0 2 2 0 1 0-4 0M5 6a2 2 0 1 0 4 0 2 2 0 1 0-4 0m10 0a2 2 0 1 0 4 0 2 2 0 1 0-4 0M7 8v8m2-2a5 5 0 0 0 8-5"/>',
    stack: '<path d="m12 4-8 4 8 4 8-4-8-4m-8 8 8 4 8-4m-16 4 8 4 8-4"/>',
    folders: '<path d="M9 4h3l2 2h5a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2"/><path d="M17 17v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2h2"/>',
    message: '<path d="M8 9h8m-8 4h6m4-9a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-5l-5 3v-3H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z"/>',
    arrowLeft: '<path d="M5 12h14M5 12l6 6m-6-6 6-6"/>',
    flask: '<path d="M9 3h6m-5 6h4m-4-6v7L5 19a1 1 0 0 0 1 2h12a1 1 0 0 0 1-2l-5-9V3"/>',
  };
  function icon(name) {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 24 24');
    s.setAttribute('class', 'ic');
    s.setAttribute('aria-hidden', 'true');
    s.innerHTML = ICONS[name] || ICONS.file;
    return s;
  }
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function add(parent, ...kids) { for (const k of kids) if (k) parent.append(k); return parent; }
  function btn(cls, kids, onClick, label) {
    const b = add(el('button', cls), ...kids);
    b.type = 'button';
    if (label) b.setAttribute('aria-label', label);
    b.addEventListener('click', onClick);
    return b;
  }
  const named = (secs, name) => ((secs || []).find((s) => s.name === name) || {}).text || '';
  const pill = (cls, text) => el('span', `pill st ${cls}`, text);
  const byKey = new Map(data.tickets.map((t) => [t.key, t]));

  // Markdown to safe HTML; without the libraries (offline), the text as it is.
  function md(text) {
    if (!window.marked || !window.DOMPurify) return el('pre', 'raw', text);
    const box = el('div', 'md');
    box.innerHTML = window.DOMPurify.sanitize(window.marked.parse(text, { gfm: true }));
    box.querySelectorAll('table').forEach((t) => { const w = el('div', 'tablewrap'); t.replaceWith(w); w.append(t); });
    box.querySelectorAll('a[href]').forEach((a) => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
    box.querySelectorAll('pre code.language-mermaid').forEach((c) => {
      const d = el('div', 'mmd', c.textContent);
      c.parentElement.replaceWith(d);
      diagrams.push(d);
    });
    if (window.hljs) {
      box.querySelectorAll('pre code').forEach((c) => {
        const lang = (/language-([\w+#.-]+)/.exec(c.className) || [])[1];
        if (lang && window.hljs.getLanguage(lang)) window.hljs.highlightElement(c);
      });
    }
    if (diagrams.length) queueMicrotask(drawDiagrams);
    return box;
  }

  // ```mermaid blocks as diagrams. The library (about 3 MB) loads only when a page has one; until it
  // loads, or when it cannot, the block shows its source.
  const diagrams = [];
  let mermaidLoad = null;
  function loadMermaid() {
    mermaidLoad = mermaidLoad || new Promise((done, fail) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js';
      s.integrity = 'sha512-6a80OTZVmEJhqYJUmYd5z8yHUCDlYnj6q9XwB/gKOEyNQV/Q8u+XeSG59a2ZKFEHGTYzgfOQKYEBtrZV7vBr+Q==';
      s.crossOrigin = 'anonymous';
      s.referrerPolicy = 'no-referrer';
      s.onload = () => (window.mermaid ? done(window.mermaid) : fail(new Error('no mermaid')));
      s.onerror = fail;
      document.head.append(s);
    });
    return mermaidLoad;
  }
  const darkPage = () => document.documentElement.dataset.theme === 'dark'
    || (document.documentElement.dataset.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
  let drawing = false;
  let drawn = 0;
  async function drawDiagrams() {
    if (drawing) return;
    drawing = true;
    try {
      const m = await loadMermaid();
      // One at a time: the theme is a global setting of the library.
      while (diagrams.length) {
        const d = diagrams.shift();
        if (!d.isConnected) continue;
        m.initialize({ startOnLoad: false, securityLevel: 'strict', theme: d.closest('.gh') || darkPage() ? 'dark' : 'default' });
        try { d.innerHTML = (await m.render(`mmd-${++drawn}`, d.textContent)).svg; } catch { d.classList.add('failed'); d.replaceChildren(el('pre', 'raw', d.textContent)); }
      }
    } catch {
      for (const d of diagrams.splice(0)) d.replaceChildren(el('pre', 'raw', d.textContent));
    } finally { drawing = false; }
    if (diagrams.length) drawDiagrams();
  }

  // Boundaries: [kind, text] rows when every line is "- always: / - ask first: / - never: ...", else null.
  function boundRows(text) {
    const rows = text.split('\n').filter((l) => l.trim()).map((l) => /^\s*[-*]\s+(?:\*\*)?(always|ask first|never)(?:\*\*)?\s*:\s*(.*)$/i.exec(l));
    return rows.length && rows.every(Boolean) ? rows.map(([, k, what]) => [k.toLowerCase() === 'ask first' ? 'ask' : k.toLowerCase(), what]) : null;
  }
  function bounds(text) {
    const rows = boundRows(text);
    if (!rows) return md(text);
    const box = el('div', 'bounds');
    for (const [k, what] of rows) add(box, add(el('div', `bound ${k}`), el('b', '', L(k)), md(what)));
    return box;
  }

  // The overview's decisions, "D1. what — why" (or "- D1. what - why", "**D1.** what: why"), as cards;
  // any other text as it is.
  const DEC = /^\s*(?:[-*]\s+)?(?:\*\*)?(D\d+)\.?(?:\*\*)?\.?\s+(.+)$/;
  function decisionList(text) {
    const rows = text.split('\n').filter((l) => l.trim()).map((l) => DEC.exec(l));
    return rows.length && rows.every(Boolean) ? rows.map(([, id, rest]) => {
      const cut = /\s[—–]\s|\s-\s/.exec(rest);
      return { id, what: cut ? rest.slice(0, cut.index) : rest, why: cut ? rest.slice(cut.index + cut[0].length) : '' };
    }) : null;
  }
  const decisionsText = data.overview ? named(data.overview.sections, 'Decisions') : '';
  const decisions = decisionList(decisionsText) || [];
  function decisionCard(d) {
    const card = el('div', 'dec');
    card.id = `dec-${d.id}`;
    add(card, el('span', 'key', d.id), add(el('div', 'what'), md(d.what)));
    if (d.why) card.append(add(el('div', 'why'), md(d.why)));
    return card;
  }
  function decisionsBox(text) {
    const list = decisionList(text);
    if (!list) return md(text);
    return add(el('div', 'md'), ...list.map(decisionCard));
  }

  // A section in a window (the overview, research): its label and text.
  function part(s, skip) {
    if (skip && skip.includes(s.name)) return null;
    if (!s.name) return md(s.text);
    if (!s.text) return null;
    const cls = s.name === 'Correct the priors' ? ' trap' : s.name === 'Example' ? ' example' : '';
    const box = el('div', `part${cls}`);
    box.dataset.section = s.name;
    const body = s.name === 'Boundaries' ? bounds(s.text) : s.name === 'Decisions' ? decisionsBox(s.text) : md(s.text);
    add(box, el('span', 'lbl', sectionName(s.name)), body);
    if (s.name === 'Terms') box.classList.add('terms');
    return box;
  }

  // The window over the page; one at a time. Esc, the cross or a click outside closes it.
  let opener = null;
  function openSheet(title, sub, fill, focusSel, cls) {
    closeSheet();
    opener = document.activeElement;
    const scrim = el('div', 'scrim');
    scrim.id = 'sheet';
    const sheet = el('div', `sheet${cls ? ` ${cls}` : ''}`);
    sheet.setAttribute('role', 'dialog');
    sheet.setAttribute('aria-modal', 'true');
    sheet.setAttribute('aria-labelledby', 'sheet-title');
    const h = el('h2', '', title);
    h.id = 'sheet-title';
    const x = btn('x', [icon('x')], closeSheet, L('close'));
    const content = el('div', 'content');
    fill(content);
    if (!cls) enrich(content);
    add(sheet, add(el('div', 'top'), add(el('div', 't'), h, sub ? el('span', 'sub', sub) : null), x), content);
    scrim.append(sheet);
    scrim.addEventListener('click', (e) => { if (e.target === scrim) closeSheet(); });
    document.body.append(scrim);
    document.body.classList.add('locked');
    const target = focusSel && content.querySelector(focusSel);
    if (target) { target.scrollIntoView({ block: 'start' }); target.classList.add('hit'); }
    x.focus({ preventScroll: true });
  }
  function closeSheet() {
    const s = document.getElementById('sheet');
    if (!s) return;
    s.remove();
    document.body.classList.remove('locked');
    if (opener && opener.isConnected) opener.focus({ preventScroll: true });
    opener = null;
  }
  const openDecisions = (id) => openSheet(sectionName('Decisions'), data.overview.file, (c) => c.append(decisionsBox(decisionsText)), id ? `#dec-${id}` : null);

  // Terms as hints (the first use in every block of text) and "D3" as a link to that decision.
  function enrich(root) {
    addTips(root);
    linkDecisions(root);
  }
  function textNodes(root, reject) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: (n) => (n.parentElement.closest(reject) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT),
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    return nodes;
  }
  function linkDecisions(root) {
    if (!decisions.length) return;
    const known = new Set(decisions.map((d) => d.id));
    for (let node of textNodes(root, 'pre, a, button, .dec, .tip, .key')) {
      let m;
      while (node && (m = /\bD\d+\b/.exec(node.data))) {
        const hit = node.splitText(m.index);
        const rest = hit.splitText(m[0].length);
        if (known.has(m[0])) { const id = m[0]; hit.replaceWith(btn('dref', [document.createTextNode(id)], () => openDecisions(id))); }
        node = rest;
      }
    }
  }
  function addTips(root) {
    if (!data.terms.length) return;
    const byLower = new Map(data.terms.map((t) => [t.term.toLowerCase(), t.text]));
    const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const words = data.terms.map((t) => t.term).sort((a, b) => b.length - a.length).map(esc).join('|');
    const re = new RegExp(`(?<![\\p{L}\\p{N}_])(${words})(?![\\p{L}\\p{N}_])`, 'iu');
    root.querySelectorAll('.md').forEach((box) => {
      if (box.closest('.terms') || box.parentElement.closest('.md')) return;
      const used = new Set();
      for (let node of textNodes(box, 'code, pre, a, button, .tip, h1, h2, h3, h4')) {
        let m;
        while (node && (m = re.exec(node.data))) {
          const key = m[1].toLowerCase();
          const hit = node.splitText(m.index);
          const rest = hit.splitText(m[1].length);
          if (!used.has(key)) {
            used.add(key);
            const tip = el('span', 'tip', hit.data);
            tip.tabIndex = 0;
            const bubble = el('span', 'bubble', `${m[1]}: ${byLower.get(key)}`);
            bubble.setAttribute('role', 'tooltip');
            tip.append(bubble);
            hit.replaceWith(tip);
          }
          node = rest;
        }
      }
    });
  }

  // A chip with its window: one open at a time, the same chip, its cross or a click elsewhere closes it.
  function popChip(kids, fill) {
    const wrap = el('span', 'popwrap');
    const chip = btn('chip', kids, (e) => {
      e.stopPropagation();
      const open = !wrap.classList.contains('open');
      closeFloats();
      if (!open) return;
      const pop = el('div', 'float');
      pop.setAttribute('role', 'dialog');
      fill(pop);
      pop.prepend(btn('fx', [icon('x')], (ev) => { ev.stopPropagation(); closeFloats(); chip.focus(); }, L('close')));
      wrap.classList.add('open');
      wrap.append(pop);
      chip.setAttribute('aria-expanded', 'true');
    });
    chip.setAttribute('aria-expanded', 'false');
    return add(wrap, chip);
  }
  // ⓘ with its text in a tooltip: hover shows it, a click or tap pins it until a click elsewhere.
  let tipCount = 0;
  // A button whose text shows as a tooltip: on hover with a mouse, on a tap on a phone.
  const bubbleButton = (cls, kids, text, label) => {
    const wrap = el('span', 'infowrap');
    const bubble = el('span', 'bubble', text);
    bubble.id = `info-${++tipCount}`;
    bubble.setAttribute('role', 'tooltip');
    const b = btn(cls, kids, (e) => {
      e.stopPropagation();
      const open = !wrap.classList.contains('open');
      closeFloats();
      wrap.classList.toggle('open', open);
      b.setAttribute('aria-expanded', String(open));
    }, label);
    b.setAttribute('aria-expanded', 'false');
    b.setAttribute('aria-describedby', bubble.id);
    return add(wrap, b, bubble);
  };
  const infoButton = (key) => bubbleButton('info', [icon('info')], L(`info.${key}`), L('what_is'));
  // A ticket of a repository that is not on this machine: why its state is unknown. Inside another
  // button (a list item, a dependency) only a mark with its text on hover: a button holds no button.
  // A ticket's repository: by its key's prefix, else by its name (this repository's tickets under
  // another prefix); null for one the page does not list. Names alone may repeat.
  const repoOf = (t) => data.repos.find((r) => r.prefix === t.prefix) || data.repos.find((r) => r.name === t.repo) || null;
  const isOff = (t) => Boolean(repoOf(t) && !repoOf(t).commit);
  const repoOfKey = (key) => (data.repos.find((r) => r.prefix === key.split('-')[0]) || { name: key.split('-')[0] }).name;
  const offText = (repo) => L('not_on_pc_title', { repo });
  const offBadge = (repo) => bubbleButton('pill off', [icon('alert'), el('span', '', L('not_on_pc'))], offText(repo));
  const offMark = (repo) => { const m = el('span', 'pill off', L('not_on_pc')); m.title = offText(repo); return m; };
  // Where a dependency's code is, when that says more than its state (scripts/lib/plans-state.js whereOf):
  // in this feature branch already, in another branch, or on this machine's main only. `v`: the
  // dependency's and the waiting ticket's keys.
  function whereMark(w, v) {
    if (!w || !['yours', 'feature', 'local', 'ticket'].includes(w.kind)) return null;
    const x = { ...w, ...v };
    const [text, title] = w.kind === 'yours' ? [L('where_yours', x), L('where_yours_title', x)]
      : w.kind === 'feature' ? [w.word === 'feature branch' ? L('where_feature', x) : L('where_branch', x), w.pull ? L('where_pull_title', x) : L('where_wait_title', x)]
        : w.kind === 'local' ? [L('where_local', x), L('where_local_title', x)] : [L('where_ticket', x), L('where_ticket_title', x)];
    const m = el('span', 'pill off', text);
    m.title = title;
    return m;
  }
  const UNKNOWN_STATE = 'state unknown';
  function closeFloats() {
    document.querySelectorAll('.infowrap.open, .popwrap.open').forEach((w) => {
      w.classList.remove('open');
      w.firstElementChild.setAttribute('aria-expanded', 'false');
      const pop = w.querySelector('.float');
      if (pop) pop.remove();
    });
  }
  document.addEventListener('click', (e) => { if (!e.target.closest || !e.target.closest('.infowrap, .popwrap')) closeFloats(); });

  // --- the left column ---

  const OVERVIEW_ICONS = { Decisions: 'bulb', Contract: 'braces', Level: 'stairs', 'Out of scope': 'ban', Terms: 'book', Parts: 'stack',
    'Design sketch': 'stack', 'Open questions': 'alert', 'What was gathered': 'list', Stubs: 'braces', 'Next action': 'play' };
  function featureCard() {
    const card = el('header', 'card');
    add(card, add(el('div', 'rowline'), add(el('span', 'tag'), icon('stack'), el('span', '', L('feature'))), el('span', 'featname', data.feature)),
      el('h1', '', data.heading));
    const projects = popChip([icon('folders'), el('span', '', L('projects', { n: data.repos.length }))], (p) => {
      for (const r of data.repos) {
        const n = data.tickets.filter((t) => repoOf(t) === r).length;
        p.append(add(el('div', 'r'), el('b', '', r.name), el('span', 'small muted mono', r.prefix), el('span', 'small muted', `${L('ticket_count', { n })}${r.commit ? '' : ` · ${L('not_on_pc')}`}`)));
      }
    });
    const when = new Date(data.generated);
    const date = when.toLocaleDateString(data.language, { day: 'numeric', month: 'short', year: 'numeric' });
    const asOf = popChip([icon('commit'), el('span', '', L('as_of', { date }))], (p) => {
      p.append(el('span', 'small muted', L('as_of_title')));
      for (const r of data.repos) p.append(add(el('div', 'r'), el('b', '', r.name), r.commit ? el('span', 'key', r.commit) : el('span', 'small muted', L('not_on_pc'))));
      p.append(el('span', 'small muted', L('built', { date: when.toLocaleString(data.language, { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) })));
    });
    card.append(add(el('div', 'rowline chips'), projects, asOf));
    const o = data.overview;
    const plain = o ? named(o.sections, 'In plain words') : '';
    if (plain) {
      const first = plain.split(/\n\s*\n/)[0];
      card.append(add(el('div', 'lead clamp'), md(first)));
      // The whole of In plain words in a window: the card shows its first paragraph, cut at four lines.
      if (first.length < plain.length || first.length > 160) card.append(btn('more', [document.createTextNode(`${L('read_more')} →`)], () => openSheet(L('about'), o.file, (c) => c.append(md(plain)))));
    }
    const btns = el('div', 'btns');
    if (o) {
      for (const s of o.sections) {
        if (!s.name || !s.text || ['In plain words', 'Tickets'].includes(s.name)) continue;
        const n = s.name === 'Decisions' ? decisions.length || null : s.name === 'Terms' ? data.terms.length || null : null;
        const kids = [icon(OVERVIEW_ICONS[s.name] || 'file'), el('span', '', sectionName(s.name))];
        if (n) kids.push(el('span', 'n', String(n)));
        btns.append(btn('btn', kids, () => (s.name === 'Decisions' && decisions.length ? openDecisions() : openSheet(sectionName(s.name), o.file, (c) => c.append(part(s))))));
      }
    }
    if (data.research.length) {
      btns.append(btn('btn', [icon('flask'), el('span', '', L('research')), el('span', 'n', String(data.research.length))], () => openSheet(L('research'), 'research/', (c) => {
        for (const r of data.research) {
          const box = add(el('article', 'report'), el('h3', '', r.title), el('span', 'small muted mono', `research/${r.name}`));
          for (const s of r.sections) add(box, part(s));
          c.append(box);
        }
      })));
    }
    if (btns.childNodes.length) card.append(btns);
    if (data.translatedFrom) {
      let lang = data.translatedFrom;
      try { lang = new Intl.DisplayNames([data.language], { type: 'language' }).of(lang) || lang; } catch { /* the code as it is */ }
      card.append(el('p', 'tnote', L('translated', { lang })));
    }
    if (draft) card.append(el('p', 'note', L('draft_note')));
    return card;
  }

  // What is in work (every repository), else what is next; the bar and the counts.
  function statusCard() {
    const t = data.tickets;
    if (!t.length || draft) return null;
    const doing = t.filter((x) => x.state === 'in progress');
    const next = t.find((x) => x.next);
    const allDone = t.every((x) => ['done', 'waiting'].includes(groupOf(x)));
    const kind = doing.length ? '' : next ? ' next' : allDone ? ' done' : ' next';
    const card = el('section', `card status${kind}`);
    const head = add(el('div', 'head'), el('span', 't', doing.length ? L('in_work') : next ? L('next_up') : allDone ? L('all_done') : L('tickets')));
    head.append(infoButton('status'));
    card.append(head);
    for (const x of doing.length ? doing : next ? [next] : []) {
      card.append(btn('focusitem', [add(el('span', 'rowline'), el('span', 'chip', x.repo), el('span', 'key', x.key)), el('span', 't', x.title || x.key),
        x.via ? add(el('span', 'rowline'), ...viaChips(x.via)) : null], () => select(x.key, true)));
    }
    if (doing.length && next) card.append(el('span', 'hint', L('then_next', { key: next.key, repo: next.repo })));
    const counts = {};
    for (const x of t) counts[countGroup(groupOf(x))] = (counts[countGroup(groupOf(x))] || 0) + 1;
    const bar = el('div', 'bar');
    for (const g of ['done', 'waiting', 'doing']) if (counts[g]) { const s = el('span', g); s.style.width = `${(counts[g] / t.length) * 100}%`; bar.append(s); }
    card.append(bar);
    const pills = el('div', 'rowline');
    for (const g of ['done', 'waiting', 'doing', 'todo', 'unknown']) if (counts[g]) pills.append(pill(PILL[g], `${counts[g]} ${groupText(g)}`));
    return add(card, pills);
  }

  const items = new Map();
  function listCard() {
    if (!data.tickets.length) return null;
    const card = add(el('nav', 'card list'), el('h2', '', L('tickets')));
    card.setAttribute('aria-label', L('tickets'));
    // By repository; a ticket of a repository the page does not list (a draft's repo: that plan.md
    // lacks) goes into a group named by its repo, so every ticket is in the list once.
    const groups = data.repos.map((r) => ({ name: r.name, list: data.tickets.filter((t) => repoOf(t) === r) }));
    for (const name of new Set(data.tickets.filter((t) => !repoOf(t)).map((t) => t.repo))) groups.push({ name, list: data.tickets.filter((t) => !repoOf(t) && t.repo === name) });
    for (const { name, list: mine } of groups) {
      if (!mine.length) continue;
      card.append(add(el('div', 'grp'), el('span', '', name), el('span', 'sp'), el('span', 'cnt', L('ticket_count', { n: mine.length }))));
      for (const t of mine) {
        const dot = el('span', `dot ${groupOf(t)}`);
        dot.title = stateText(t.next ? 'next' : t.state);
        const off = isOff(t);
        const b = btn('item', [dot, el('span', 'k', t.key), el('span', 'tt', t.title || t.key), off ? offMark(t.repo) : null], () => select(t.key, true));
        b.title = `${t.key} · ${t.title} · ${dot.title}${off ? ` · ${offText(t.repo)}` : ''}`;
        items.set(t.key, b);
        card.append(b);
      }
    }
    return card;
  }

  // --- the chosen ticket ---

  const BLOCK_ICONS = { 'In plain words': 'message', Example: 'list', 'Acceptance criteria': 'check', 'How to check': 'terminal', Boundaries: 'shield',
    'Correct the priors': 'alert', 'Where to look': 'folder', Why: 'bulb', Dependencies: 'link' };
  function block(name, cls, ...body) {
    const box = el('section', `block${cls ? ` ${cls}` : ''}`);
    box.dataset.section = name;
    const head = add(el('div', 'bh'), icon(BLOCK_ICONS[name] || 'file'), el('span', 't', sectionName(name)));
    box.append(head);
    if (data.labels[`info.${snake(name)}`] !== undefined) head.append(infoButton(snake(name)));
    if (data.labels[`lead.${snake(name)}`] !== undefined) box.append(el('p', 'lead', L(`lead.${snake(name)}`)));
    return add(box, ...body);
  }
  function dependencies(t) {
    const box = el('div', 'md');
    if (!t.depends.length) box.append(el('p', 'muted', L('no_deps')));
    for (const d of t.depends) {
      const other = byKey.get(d.key);
      // met null: the dependency's repository is not read on this machine, so its state is unknown.
      const unknown = d.met === null;
      const shown = other && other.next ? 'next' : d.state || (other ? other.state : UNKNOWN_STATE);
      const group = other ? groupOf(other) : GROUP_OF[shown];
      const state = unknown || !group || group === 'unknown' ? pill('s-unknown', L('state.unknown')) : pill(PILL[group], stateText(shown));
      const elsewhere = whereMark(d.where, { key: d.key, ticket: t.key });
      const row = btn('dep', [el('span', 'key', d.key), other ? el('span', '', other.title) : null, state,
        other ? el('span', 'small muted', other.repo) : null, unknown ? offMark(other ? other.repo : repoOfKey(d.key)) : elsewhere], () => { if (other) select(d.key, true); });
      if (!other) row.disabled = true;
      box.append(row);
    }
    return box;
  }
  // "today", "3 days ago": the day of a commit (Unix seconds) against the day the page was made.
  function daysAgo(sec) {
    const day = (d) => Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
    const n = Math.round((day(new Date(data.generated)) - day(new Date(sec * 1000))) / (24 * 60 * 60 * 1000));
    if (n > 30) return new Date(sec * 1000).toLocaleDateString(data.language, { day: 'numeric', month: 'short', year: 'numeric' });
    try { return new Intl.RelativeTimeFormat(data.language, { numeric: 'auto' }).format(-n, 'day'); } catch { return new Date(sec * 1000).toLocaleDateString(); }
  }
  // Where the work behind a state is: [icon, text, explanation] each.
  function viaParts(v) {
    if (!v) return [];
    if (v.kind === 'task') return [['play', L('via_task')]];
    if (v.kind === 'session') return [['message', L('via_session')]];
    if (v.kind === 'commits') return [['commit', L('via_commits', { branch: v.branch })]];
    const out = [['branch', L('via_branch', { branch: v.branch }), L('via_branch_title')]];
    const when = v.date ? daysAgo(v.date) : null;
    if (v.author && when) out.push(['commit', L('via_last', { who: v.author, when })]);
    else if (v.author || when) out.push(['commit', L('via_last_when', { when: v.author || when })]);
    return out;
  }
  const viaChips = (v) => viaParts(v).map(([ic, text, why]) => { const c = add(el('span', 'chip'), icon(ic), el('span', '', text)); if (why) c.title = why; return c; });
  function whyBlock(t) {
    const text = named(t.sections, 'Why');
    if (!text) return null;
    const refs = [...new Set(text.match(/\bD\d+\b/g) || [])].map((id) => decisions.find((d) => d.id === id)).filter(Boolean);
    return block('Why', '', md(text), ...refs.map(decisionCard));
  }
  // The md file as GitHub draws it: the front matter as a table, then the markdown.
  function frontMatter(text) {
    const m = /^---\n([\s\S]*?)\n---\n?/.exec(text);
    if (!m) return [null, text];
    const rows = m[1].split('\n').map((l) => /^([\w-]+):\s?(.*)$/.exec(l)).filter(Boolean);
    if (!rows.length) return [null, text.slice(m[0].length)];
    const table = el('table', 'fm');
    add(table, add(el('thead'), add(el('tr'), ...rows.map((r) => el('th', '', r[1])))), add(el('tbody'), add(el('tr'), ...rows.map((r) => el('td', '', r[2])))));
    return [add(el('div', 'tablewrap'), table), text.slice(m[0].length)];
  }
  function mdFile(t) {
    openSheet(`${t.key} · ${L('show_md')}`, t.title, (c) => {
      const [fm, body] = frontMatter(t.md);
      const box = md(body);
      box.classList.add('gh');
      if (fm) box.prepend(fm);
      if (data.translatedFrom) box.prepend(el('p', 'tnote', L('md_note')));
      c.append(box);
    }, null, 'ghfile');
  }

  const detail = el('article', 'card detail');
  let current = null;
  function renderDetail(t) {
    detail.textContent = '';
    const back = btn('back', [icon('arrowLeft'), el('span', '', L('back'))], () => { document.body.classList.remove('reading'); const i = items.get(t.key); if (i) i.focus(); });
    const g = groupOf(t);
    const top = add(el('div', 'rowline'), pill(PILL[g], stateText(t.next ? 'next' : t.state)), el('span', 'key', t.key), el('span', 'chip', t.repo),
      isOff(t) ? offBadge(t.repo) : null, el('span', 'sp'));
    if (t.md) top.append(btn('btn', [icon('file'), el('span', '', L('show_md'))], () => mdFile(t)));
    const meta = el('div', 'rowline');
    meta.append(...viaChips(t.via));
    if (t.files) meta.append(add(el('span', 'chip'), icon('folder'), el('span', '', L('files', { n: t.files }))));
    if (t.criteria) meta.append(add(el('span', 'chip'), icon('check'), el('span', '', L('criteria', { n: t.criteria }))));
    for (const d of t.depends) {
      const c = add(el('span', 'chip'), icon('link'), el('span', '', `${L('after')} ${d.key}${d.met ? ' ✓' : d.met === null ? ' ?' : ''}`));
      if (d.met === null) c.title = `${L('state.unknown')}: ${offText(byKey.has(d.key) ? byKey.get(d.key).repo : repoOfKey(d.key))}`;
      meta.append(c);
    }
    const title = el('h2', 'ttl', t.title || t.key);
    title.tabIndex = -1;
    add(detail, back, add(el('div', 'dhead'), top, title, meta.childNodes.length ? meta : null));
    if (!t.sections) { detail.append(el('p', 'muted', L('not_here', { repo: t.repo }))); return; }
    const s = (name) => named(t.sections, name);
    const goal = s('Goal') ? add(el('div', 'goal'), el('span', 'lb', sectionName('Goal')), md(s('Goal'))) : null;
    if (s('In plain words') || goal) detail.append(block('In plain words', 'plain', s('In plain words') ? md(s('In plain words')) : null, goal));
    if (s('Correct the priors')) detail.append(block('Correct the priors', 'trap', md(s('Correct the priors'))));
    if (s('Example')) detail.append(block('Example', 'example', md(s('Example'))));
    if (s('Acceptance criteria')) detail.append(block('Acceptance criteria', '', md(s('Acceptance criteria'))));
    if (s('How to check')) detail.append(block('How to check', '', md(s('How to check'))));
    if (s('Boundaries') || s('Out of scope')) {
      detail.append(block('Boundaries', '', s('Boundaries') ? bounds(s('Boundaries')) : null,
        s('Out of scope') ? add(el('div', 'oos'), el('span', 'lb', sectionName('Out of scope')), md(s('Out of scope'))) : null));
    }
    if (s('Where to look')) detail.append(block('Where to look', '', md(s('Where to look'))));
    add(detail, whyBlock(t));
    detail.append(block('Dependencies', '', dependencies(t), s('Dependencies') && s('Dependencies').trim() !== '-' ? md(s('Dependencies')) : null));
    enrich(detail);
  }

  // `focus`: the person opened it (a click, Enter, the first #KEY), so the ticket comes into view; the
  // arrow keys pass false and move only through the list.
  function select(key, focus) {
    const t = byKey.get(key);
    if (!t) return;
    current = key;
    for (const [k, b] of items) b.setAttribute('aria-current', String(k === key));
    renderDetail(t);
    if (!focus) return;
    document.body.classList.add('reading');
    if (matchMedia('(max-width: 1099px)').matches) window.scrollTo(0, 0);
    else detail.scrollIntoView({ block: 'start' });
    const h = detail.querySelector('h2.ttl');
    if (h) h.focus({ preventScroll: true });
  }

  // ↑ / ↓ move through the list on a computer, when no window is open and no field is in use.
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeFloats(); closeSheet(); return; }
    if (!['ArrowUp', 'ArrowDown'].includes(e.key) || document.getElementById('sheet') || (e.target.closest && e.target.closest('input, textarea, select'))) return;
    if (!matchMedia('(min-width: 1100px)').matches) return;
    const keys = [...items.keys()];
    const i = keys.indexOf(current) + (e.key === 'ArrowDown' ? 1 : -1);
    if (i < 0 || i >= keys.length) return;
    e.preventDefault();
    select(keys[i], false);
    items.get(keys[i]).focus();
  });

  const app = document.getElementById('app');
  app.textContent = '';
  const side = add(el('aside', 'side'), featureCard(), statusCard(), listCard());
  const col = add(el('div', 'detail-col'), detail);
  add(app, add(el('div', 'layout'), side, data.tickets.length ? col : null), el('footer', '', L('footer')));
  enrich(side);
  // The ticket shown first: the one the link names (#API-122), else the one in work, else the next.
  let asked = '';
  try { asked = decodeURIComponent(location.hash.slice(1)).toUpperCase(); } catch { /* a broken link: the default ticket */ }
  const fromLink = byKey.has(asked) ? asked : null;
  const first = fromLink || (data.tickets.find((t) => t.state === 'in progress') || data.tickets.find((t) => t.next) || data.tickets[0] || {}).key;
  if (first) select(first, Boolean(fromLink));
})();
</script>
